<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1e1e1e">
<title>Mix-Mr.Chang</title>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/2.17.0/cloudbase.full.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
:root{
  --bg:#1e1e1e;--bg2:#262626;--bg3:#2f2f2f;--bg4:#3a3a3a;--bd:#363636;--bd2:#4a4a4a;
  --fg:#dcddde;--dim:#8a8a8a;--faint:#666;
  --ac:#a882ff;--acS:rgba(168,130,255,.15);--acR:rgba(168,130,255,.32);
  --dg:#e05252;--ok:#3ecf8e;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --side-w:280px;
  --data-bg:#191b21;--data-bg2:#20222a;--data-bg3:#282b34;--data-bd:#2c2f38;
  --note-bg:#1e1e1e;--note-bg2:#262626;--note-bg3:#2f2f2f;--note-bd:#363636;
  --out-bg:#1d1a21;--out-bg2:#25212a;--out-bg3:#2e2934;--out-bd:#342e3a;
}
html[data-theme=light]{
  --bg:#fff;--bg2:#f7f7f7;--bg3:#efefef;--bg4:#e4e4e4;--bd:#e2e2e2;--bd2:#cfcfcf;
  --fg:#2e3338;--dim:#8a8a8a;--faint:#b8b8b8;
  --ac:#705dcf;--acS:rgba(112,93,207,.12);--acR:rgba(112,93,207,.32);
  --dg:#d64545;--ok:#0a9d4f;
  --data-bg:#f7f8fc;--data-bg2:#eff1f8;--data-bg3:#e8ebf3;--data-bd:#dde0e8;
  --note-bg:#fff;--note-bg2:#f7f7f7;--note-bg3:#efefef;--note-bd:#e2e2e2;
  --out-bg:#fcf9ff;--out-bg2:#f4f1f8;--out-bg3:#ece8f2;--out-bd:#e2dcE8;
}
body{background:var(--bg);color:var(--fg);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;height:100dvh;overflow:hidden;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(140,140,140,.28);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

.app{height:100dvh;display:flex;overflow:hidden}

.side{
  width:var(--side-w);flex:0 0 var(--side-w);
  background:var(--bg2);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;min-height:0;
  padding-top:var(--sat);
  transition:background .35s,border-color .35s;
}
@media(max-width:768px){
  .side{
    position:fixed;top:0;left:0;bottom:0;z-index:100;
    width:min(84vw,var(--side-w));flex:none;
    transform:translateX(-102%);transition:transform .26s cubic-bezier(.4,0,.2,1),background .35s;
    padding-top:var(--sat);padding-bottom:var(--sab);
    box-shadow:4px 0 24px rgba(0,0,0,.45);
  }
  .side.open{transform:none}
}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:90}
.scrim.on{opacity:1;pointer-events:auto}
@media(min-width:769px){.scrim{display:none}}

.brand-link{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;
  font-size:16px;font-weight:700;color:var(--fg);transition:.15s;flex-shrink:0}
.brand-link:active{background:var(--bg3)}
.brand-link .logo{width:28px;height:28px;flex:0 0 28px;border-radius:8px;
  background:linear-gradient(135deg,var(--ac),#5b4bd6);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}

.quick-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;
  padding:0 12px 10px;margin-bottom:6px;border-bottom:1px solid var(--bd);flex-shrink:0}
.quick-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:8px 2px 7px;border-radius:8px;color:var(--dim);font-size:10.5px;letter-spacing:.2px;line-height:1;
  border:1px solid transparent;transition:.14s;user-select:none;white-space:nowrap;overflow:hidden;min-width:0}
.quick-nav a:hover{background:var(--bg3);color:var(--fg);border-color:var(--bd2)}
.quick-nav a:active{transform:scale(.95)}
.quick-nav a.current{background:var(--acS);border-color:var(--acR);color:var(--ac)}
.quick-nav .nav-ico{width:15px;height:15px;flex:0 0 auto;opacity:.85;transition:.14s}
.quick-nav a:hover .nav-ico{opacity:1;transform:scale(1.05)}
.quick-nav span{overflow:hidden;text-overflow:ellipsis;max-width:100%}

.side-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
  padding:4px 12px 10px;flex-shrink:0}
.side-tabs button{
  padding:7px 4px;border-radius:8px;font-size:12px;font-weight:600;color:var(--dim);
  background:transparent;border:1px solid transparent;transition:.14s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-tabs button:hover{background:var(--bg3);color:var(--fg)}
.side-tabs button.on{background:var(--acS);color:var(--ac);border-color:var(--acR)}

.drawer-actions{padding:0 12px 6px;flex-shrink:0}
.drawer-actions button{width:100%;height:38px;border-radius:9px;background:var(--bg3);color:var(--fg);
  font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--bd);transition:.15s}
.drawer-actions button:active{background:var(--bg4);transform:scale(.98)}

.drawer-label{display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px 6px;font-size:11px;font-weight:600;letter-spacing:1px;color:var(--faint);
  text-transform:uppercase;flex-shrink:0}
.drawer-label .n{font-size:11px;font-weight:600;color:var(--dim);background:var(--bg3);
  padding:1px 7px;border-radius:9px}

.art-list{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 8px 10px;min-height:0;
  scrollbar-width:none;-ms-overflow-style:none;
}
.art-list::-webkit-scrollbar{display:none;width:0;height:0}

.item{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;
  font-size:14px;color:var(--fg);transition:.13s;position:relative}
.item::before{content:'';flex:0 0 7px;width:7px;height:7px;margin-top:7px;border-radius:50%;
  background:var(--ac);opacity:.45;transition:opacity .15s,box-shadow .15s}
.item:active{background:var(--bg3)}
.item.on{background:var(--acS);color:var(--fg);font-weight:500}
.item.on::before{opacity:1;box-shadow:0 0 0 3px var(--acS)}
.item .t{flex:1;min-width:0;white-space:normal;word-break:break-word;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .x{flex:0 0 auto;width:24px;height:24px;border-radius:6px;font-size:15px;color:var(--faint);
  display:grid;place-items:center;opacity:0;transition:.13s;margin-top:2px}
.item:hover .x{opacity:1}
.item .x:active{background:rgba(224,82,82,.16);color:var(--dg)}
.item.folder{color:var(--faint);font-size:11.5px;font-weight:600;padding:8px 10px 4px;
  letter-spacing:.5px;text-transform:none;pointer-events:none}
.item.folder::before{display:none}
.item.folder .t{color:var(--dim)}
.item.sub{padding-left:20px}
.empty{padding:26px 16px;text-align:center;color:var(--faint);font-size:13px;line-height:1.9}
.empty b{display:block;font-size:30px;margin-bottom:6px;opacity:.5}

.drawer-footer{flex-shrink:0;padding:10px 12px calc(10px + var(--sab));
  border-top:1px solid var(--bd);background:var(--bg2);display:flex;flex-direction:column;gap:8px;
  max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:background .35s}
.cloud-panel{border:1px solid var(--bd);border-radius:10px;padding:9px;
  background:rgba(255,255,255,.012);display:flex;flex-direction:column;gap:7px}
.cloud-head{display:flex;align-items:center;gap:7px}
.cloud-ico{width:16px;height:16px;flex:0 0 16px;display:flex;align-items:center;justify-content:center;
  color:var(--faint);transition:color .3s}
.cloud-ico svg{width:100%;height:100%;display:block;transition:transform .3s}
.cloud-ico.ok{color:var(--ok)}
.cloud-ico.sync{color:#e8b04b}
.cloud-ico.sync svg{animation:cloudSpin 1.2s linear infinite}
.cloud-ico.err{color:var(--dg)}
@keyframes cloudSpin{to{transform:rotate(360deg)}}
.cloud-label{flex:1;font-size:11.5px;color:var(--dim);letter-spacing:.3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cloud-cfg{width:24px;height:24px;flex:0 0 24px;display:grid;place-items:center;border-radius:6px;
  border:1px solid transparent;background:transparent;color:var(--faint);transition:.18s}
.cloud-cfg svg{width:13px;height:13px;display:block;transition:transform .35s}
.cloud-cfg:hover{background:var(--acS);color:var(--ac);border-color:var(--acR)}
.cloud-cfg:hover svg{transform:rotate(90deg)}
.cloud-sync-btn{width:100%;height:34px;border-radius:9px;background:var(--acS);color:var(--ac);
  border:1px solid var(--acR);font-size:12.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
.cloud-sync-btn svg{width:13px;height:13px;flex:0 0 13px;transition:transform .4s}
.cloud-sync-btn:active{transform:scale(.98)}
.cloud-sync-btn:active svg{transform:rotate(-180deg)}
.cloud-sync-btn:disabled{opacity:.5}

.df-title{font-size:10.5px;font-weight:600;letter-spacing:1px;color:var(--faint);
  text-transform:uppercase;padding:6px 2px 0}
.df-row{display:flex;gap:6px}
.df-row button{flex:1 1 0;min-width:0;height:36px;border-radius:9px;background:var(--bg3);color:var(--fg);
  font-size:12.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:5px;
  border:1px solid var(--bd);transition:.15s;padding:0 6px}
.df-row button:active{background:var(--bg4);transform:scale(.97)}
.df-row button svg{width:13px;height:13px;flex:0 0 13px;opacity:.85}
.df-hint{font-size:10.5px;color:var(--faint);text-align:center;line-height:1.5;
  word-break:break-word;min-height:14px}
.df-hint.ok{color:var(--ok)}.df-hint.err{color:var(--dg)}.df-hint.warn{color:#e8b04b}

.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg);transition:background .35s}

.topbar{display:flex;align-items:center;gap:6px;flex:0 0 auto;
  padding:calc(var(--sat) + 8px) 12px 8px;
  background:transparent;border-bottom:1px solid transparent;z-index:40;transition:border-color .35s}
.ib{width:34px;height:34px;flex:0 0 34px;border-radius:9px;display:grid;place-items:center;
  font-size:16px;color:var(--dim);transition:.13s}
.ib:active{background:var(--bg3);transform:scale(.93)}
.menu-btn{display:none}
@media(max-width:768px){.menu-btn{display:grid!important}}
.brand-title{font-weight:700;font-size:15px;padding:0 6px;flex:0 0 auto;white-space:nowrap;color:var(--ac)}
.gap{flex:1 1 auto;min-width:8px}
.mod-name{font-size:13px;color:var(--dim);padding:0 8px;font-weight:500}

.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;transition:background .35s}

body[data-mod=data] .main,
body[data-mod=data] .body,
body[data-mod=data] .side{background:var(--data-bg2)}
body[data-mod=data] .side{border-color:var(--data-bd)}
body[data-mod=data] .main{background:var(--data-bg)}
body[data-mod=data] .topbar{border-bottom-color:var(--data-bd)}
body[data-mod=data] .side .drawer-footer{background:var(--data-bg2)}
body[data-mod=data] .side .brand-link:active,
body[data-mod=data] .side .item:active,
body[data-mod=data] .side .quick-nav a:hover,
body[data-mod=data] .side .side-tabs button:hover{background:var(--data-bg3)}

body[data-mod=note] .main,
body[data-mod=note] .body,
body[data-mod=note] .side{background:var(--note-bg2)}
body[data-mod=note] .side{border-color:var(--note-bd)}
body[data-mod=note] .main{background:var(--note-bg)}
body[data-mod=note] .topbar{border-bottom-color:var(--note-bd)}
body[data-mod=note] .side .drawer-footer{background:var(--note-bg2)}
body[data-mod=note] .side .brand-link:active,
body[data-mod=note] .side .item:active,
body[data-mod=note] .side .quick-nav a:hover,
body[data-mod=note] .side .side-tabs button:hover{background:var(--note-bg3)}

body[data-mod=outline] .main,
body[data-mod=outline] .body,
body[data-mod=outline] .side{background:var(--out-bg2)}
body[data-mod=outline] .side{border-color:var(--out-bd)}
body[data-mod=outline] .main{background:var(--out-bg)}
body[data-mod=outline] .topbar{border-bottom-color:var(--out-bd)}
body[data-mod=outline] .side .drawer-footer{background:var(--out-bg2)}
body[data-mod=outline] .side .brand-link:active,
body[data-mod=outline] .side .item:active,
body[data-mod=outline] .side .quick-nav a:hover,
body[data-mod=outline] .side .side-tabs button:hover{background:var(--out-bg3)}

.mod{display:none;flex:1;min-height:0;flex-direction:column}
.mod.on{display:flex}
.scroll{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}

.wrap{padding:16px;max-width:760px;margin:0 auto;width:100%}
.paste{display:block;width:100%;height:180px;padding:16px;font-size:15px;line-height:1.7;color:var(--fg);
  background:var(--bg2);border:1.5px dashed var(--bd2);border-radius:14px;outline:0;resize:none;transition:.18s}
.paste::placeholder{color:var(--faint)}
.paste:focus{border-color:var(--ac);background:var(--acS);border-style:solid}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row button{flex:1 1 0;min-width:90px;height:42px;border-radius:10px;background:var(--bg3);
  border:1px solid var(--bd);font-size:13.5px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:.14s}
.row button:active{transform:scale(.97);background:var(--bg4)}
.row button.p{background:var(--ac);color:#fff;border-color:transparent}
.status{margin-top:10px;font-size:13px;color:var(--dim);word-break:break-word}
.status.ok{color:var(--ok)}.status.err{color:var(--dg)}.status.warn{color:#e8b04b}

.card{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px}
.card+.card{margin-top:12px}
.atitle{margin:0 0 10px;font-size:19px;font-weight:600;line-height:1.45;word-break:break-word}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{display:inline-flex;align-items:center;height:25px;padding:0 11px;border-radius:999px;
  background:var(--bg3);font-size:12px;color:var(--dim);white-space:nowrap;max-width:100%;
  overflow:hidden;text-overflow:ellipsis}
.badge.ac{background:var(--acS);color:var(--ac)}

.md{font-size:16.5px;line-height:1.78;overflow-wrap:break-word;word-break:break-word}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:0 0 1em}
.md h1,.md h2,.md h3,.md h4{margin:1.4em 0 .6em;line-height:1.4;font-weight:600}
.md h1{font-size:1.35em}.md h2{font-size:1.22em}.md h3{font-size:1.1em}
.md img{height:auto;max-width:100%!important;display:block;margin:1.1em auto;border-radius:10px;border:1px solid var(--bd)}
.md iframe,.md video{width:100%;max-width:100%;height:auto;display:block;margin:1.1em auto;
  border-radius:10px;border:1px solid var(--bd);background:#000}
.md iframe{aspect-ratio:16/9;min-height:180px}
.md a{color:var(--ac);border-bottom:1px solid var(--acS)}
.md strong{font-weight:600}
.md blockquote{margin:1.1em 0;padding:2px 0 2px 14px;border-left:3px solid var(--ac);color:var(--dim)}
.md blockquote p:last-child{margin-bottom:0}
.md hr{border:0;border-top:1px solid var(--bd);margin:1.6em 0}
.md code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86em;background:var(--bg3);
  color:var(--ac);padding:2px 5px;border-radius:5px;border:1px solid var(--bd)}
.md pre{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:13px 14px;
  margin:1.1em 0;overflow-x:auto}
.md pre code{background:none;border:0;color:var(--fg);padding:0;font-size:13px;line-height:1.6}
.md ul,.md ol{padding-left:1.4em;margin:0 0 1em}
.md li{margin:.25em 0}
.md table{border-collapse:collapse;font-size:14px;margin:1em 0;display:block;overflow-x:auto;max-width:100%}
.md th,.md td{border:1px solid var(--bd);padding:7px 11px}
.md mark{background:#ffe600;color:#000;border-radius:3px;padding:0 2px}
.md .wl{color:var(--ac);border-bottom:1px dashed var(--acR);cursor:pointer}
.md .tg{color:#7fd1b9;background:rgba(127,209,185,.12);padding:1px 7px;border-radius:10px;
  font-size:.92em;cursor:pointer}

.panes{flex:1;min-height:0;display:flex;flex-direction:column}
@media(min-width:769px){.panes[data-lay=dual]{flex-direction:row}}
.pane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg);position:relative}
.pane+.pane{border-top:1px solid var(--bd)}
@media(min-width:769px){.pane+.pane{border-top:0;border-left:1px solid var(--bd)}}
.panes[data-lay=single] .pane[data-i="1"]{display:none}
.pane.focus::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac);z-index:3}
.pane-head{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--bd);
  flex:0 0 auto;background:var(--bg2)}
.pane-title{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:15px;font-weight:600;
  padding:6px 8px;border-radius:7px;color:var(--fg)}
.pane-title:hover,.pane-title:focus{background:var(--bg3)}
.pane-title::placeholder{color:var(--faint)}
.pane-title:disabled{opacity:.5}
.pane-mode{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:2px;flex:0 0 auto}
.pane-mode button{padding:4px 9px;border-radius:6px;font-size:12px;color:var(--dim);transition:.14s}
.pane-mode button.on{background:var(--ac);color:#fff}
.pane-body{flex:1;min-height:0;display:flex;position:relative}
.pane-body[data-mode=read] .pane-editor,
.pane-body[data-mode=outline] .pane-editor{display:none}
.pane-body[data-mode=edit] .pane-preview,
.pane-body[data-mode=outline] .pane-preview{display:none}
.pane-body[data-mode=edit] .pane-outline,
.pane-body[data-mode=read] .pane-outline{display:none}

/* ===== 富文本编辑器（图片内联渲染） ===== */
.pane-editor{
  flex:1;width:100%;min-height:0;
  padding:18px 22px 80px;
  font-size:16px;line-height:1.8;letter-spacing:.2px;
  background:transparent;border:0;outline:0;color:var(--fg);
  font-family:inherit;
  white-space:pre-wrap;word-break:break-word;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  caret-color:var(--ac);
}
.pane-editor[contenteditable="false"]{opacity:.5}
.pane-editor:empty::before{
  content:attr(data-ph);
  color:var(--faint);
  pointer-events:none;
  white-space:pre-wrap;
  display:block;
}
.pane-editor img.editor-img{
  display:block;
  max-width:100%;
  height:auto;
  margin:12px auto;
  border-radius:10px;
  border:1px solid var(--bd);
  box-shadow:0 2px 12px rgba(0,0,0,.28);
  cursor:default;
  transition:box-shadow .2s,border-color .2s,transform .2s;
  user-select:none;
}
.pane-editor img.editor-img:hover{
  border-color:var(--ac);
  box-shadow:0 4px 20px var(--acS);
}
.pane-editor img.editor-img.fresh{
  animation:imgIn .55s cubic-bezier(.2,.85,.3,1.2);
}
@keyframes imgIn{
  0%{transform:scale(.78);opacity:0}
  55%{transform:scale(1.04);opacity:1}
  100%{transform:scale(1);opacity:1}
}

.pane-preview{flex:1;overflow-y:auto;padding:18px 22px 80px;font-size:16px;line-height:1.78;
  -webkit-overflow-scrolling:touch}
.pane-outline{flex:1;overflow-y:auto;padding:14px 18px 80px;-webkit-overflow-scrolling:touch}
.ot-tree{font-size:15px;line-height:1.6}
.ot-tree ul{list-style:none;padding-left:0;margin:0}
.ot-tree ul ul{padding-left:16px;margin-left:4px;border-left:1px dashed var(--bd)}
.ot-row{display:flex;align-items:flex-start;gap:4px;padding:3px 4px;border-radius:6px;transition:.12s}
.ot-row:hover{background:var(--bg2)}
.ot-toggle{flex:0 0 16px;height:22px;display:grid;place-items:center;font-size:10px;
  color:var(--faint);cursor:pointer;user-select:none}
.ot-toggle:hover{color:var(--ac)}
.ot-text{flex:1;cursor:pointer;padding:1px 4px;border-radius:4px;word-break:break-word;color:var(--fg)}
.ot-text:hover{color:var(--ac);background:var(--acS)}
.ot-node.collapsed > ul{display:none}
.ot-hint{font-size:12px;color:var(--faint);padding:4px 8px 12px;line-height:1.6}
.ot-hint b{color:var(--dim);font-weight:500}

.tree{padding:20px 24px 160px;max-width:840px;margin:0 auto}
.node-row{display:flex;align-items:flex-start;border-radius:8px}
.node-text{flex:1;outline:0;padding:4px 8px;min-height:28px;line-height:1.55;white-space:pre-wrap;
  word-break:break-word;border-radius:8px;caret-color:var(--ac);font-size:16px}
.node-row:hover .node-text{background:var(--bg2)}
.node-text:focus{background:var(--acS)}
.node-children{padding-left:22px}
.node.collapsed>.node-children{display:none}
.bullet{width:24px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  position:relative;flex:0 0 auto;user-select:none}
.bullet i{display:block;width:7px;height:7px;border-radius:50%;background:var(--faint);transition:.14s}
.node-row:hover .bullet i{background:var(--dim)}
.bullet.hc:hover i{width:14px;height:7px;border-radius:4px;background:var(--ac)}
.bullet.hc.cl i{width:18px;height:18px;border-radius:50%;background:transparent;border:1.6px solid var(--ac)}
.bullet.hc.cl::after{content:attr(data-c);position:absolute;font-size:9.5px;font-weight:700;
  color:var(--ac);line-height:1}

.mm-wrap{position:relative;flex:1;min-height:0;display:flex}
.mm-view{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:24px 24px}
.mm-view:active{cursor:grabbing}
.mm-stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.mm-svg{position:absolute;top:0;left:0;overflow:visible;z-index:0;pointer-events:none}
.mm-link{fill:none;stroke:var(--ac);stroke-opacity:.42;stroke-width:1.8;stroke-linecap:round}
.mm-node{position:absolute;z-index:1;max-width:200px;min-width:42px;padding:7px 13px;background:var(--bg3);
  border:1px solid var(--bd);border-radius:9px;font-size:14px;line-height:1.45;cursor:pointer;
  white-space:pre-wrap;word-break:break-word;user-select:none;transition:.15s;color:var(--fg);
  box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mm-node:hover{border-color:var(--ac)}
.mm-node.sel{border-color:var(--ac);box-shadow:0 0 0 3px var(--acS)}
.mm-node.center{background:var(--ac);color:#fff;border-color:transparent;font-weight:600;
  font-size:15px;padding:10px 17px}
.mm-text{display:inline;outline:0}
.mm-text.editing-text{cursor:text;caret-color:var(--ac)}
.mm-node.editing{cursor:text;min-width:90px;border-color:var(--ac);box-shadow:0 0 0 3px var(--acS)}
.mm-toggle{display:inline-block;margin-left:6px;width:15px;height:15px;line-height:15px;text-align:center;
  font-size:12px;font-weight:700;border-radius:50%;background:var(--acS);color:var(--ac);cursor:pointer;
  vertical-align:middle;user-select:none}
.mm-toggle:hover{background:var(--ac);color:#fff}
.mm-node.center .mm-toggle{background:rgba(255,255,255,.28);color:#fff}
.mm-actions{position:absolute;top:-30px;left:0;display:none;gap:2px;background:var(--bg3);
  border:1px solid var(--bd);border-radius:8px;padding:2px;
  box-shadow:0 3px 10px rgba(0,0,0,.4);z-index:5}
.mm-node:hover .mm-actions,.mm-node.sel .mm-actions{display:flex}
.mm-node.editing .mm-actions{display:none!important}
.mm-act{min-width:26px;height:24px;padding:0 7px;border:0;background:transparent;color:var(--dim);
  border-radius:5px;font-size:14px;display:flex;align-items:center;justify-content:center;
  white-space:nowrap;transition:.12s}
.mm-act:hover{background:var(--bg4);color:var(--fg)}
.mm-act.del:hover{color:var(--dg);background:rgba(224,82,82,.12)}
.mm-fit{position:absolute;right:14px;bottom:14px;z-index:5;padding:9px 16px;border-radius:10px;
  border:1px solid var(--bd);background:var(--bg3);color:var(--dim);font-size:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.3)}
.mm-fit:active{color:var(--ac);border-color:var(--ac)}

.bottombar{display:flex;align-items:center;gap:6px;flex:0 0 auto;
  padding:6px 10px calc(6px + var(--sab));
  background:transparent;border-top:1px solid transparent;z-index:40;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;transition:border-color .35s}
.bottombar::-webkit-scrollbar{display:none}
.bottombar>*{flex-shrink:0}
body[data-mod=data] .bottombar{border-top-color:var(--data-bd)}
body[data-mod=note] .bottombar{border-top-color:var(--note-bd)}
body[data-mod=outline] .bottombar{border-top-color:var(--out-bd)}

.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:3px;flex:0 0 auto}
.seg button{padding:4px 12px;border-radius:6px;font-size:12.5px;color:var(--dim);transition:.14s}
.seg button.on{background:var(--ac);color:#fff}

.ttl{background:transparent;border:0;outline:0;color:var(--fg);font-size:15px;font-weight:600;
  padding:5px 8px;border-radius:8px;min-width:0;flex:1}
.ttl:hover,.ttl:focus{background:var(--bg3)}
.ttl:disabled{opacity:.45}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:300;display:none;
  align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.mbox{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:20px;width:100%;
  max-width:400px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);
  animation:mi .18s ease}
@keyframes mi{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.mttl{font-size:15px;font-weight:700;margin-bottom:12px}
.min{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:9px;color:var(--fg);
  padding:10px 12px;font-size:14px;outline:0;margin-bottom:14px}
.min:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acS)}
.mact{display:flex;gap:8px;justify-content:flex-end}
.mbtn{padding:9px 18px;border-radius:9px;font-size:13.5px;font-weight:600;
  border:1px solid var(--bd);color:var(--dim)}
.mbtn:hover{background:var(--bg3);color:var(--fg)}
.mbtn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.mdesc{font-size:12.5px;color:var(--dim);line-height:1.65;margin:-6px 0 14px}
.mguide{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;
  font-size:11.5px;color:var(--dim);line-height:1.8;margin-bottom:14px}
.mguide ol{margin:0;padding-left:16px}
.mguide code{color:var(--ac);background:var(--acS);padding:1px 4px;border-radius:3px;font-size:10.5px}
.as-list{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.as-item{padding:12px 14px;border-radius:10px;font-size:14px;text-align:left;background:var(--bg);
  border:1px solid var(--bd);color:var(--fg);display:flex;align-items:center;gap:10px;transition:.13s}
.as-item:hover,.as-item:active{background:var(--bg3);border-color:var(--ac);color:var(--ac)}
.as-item .as-ico{font-size:17px;flex:0 0 auto}

.toast{position:fixed;left:50%;bottom:calc(20px + var(--sab));transform:translate(-50%,10px);z-index:400;
  max-width:min(80vw,420px);padding:9px 16px;border-radius:10px;background:rgba(20,20,20,.94);color:#fff;
  font-size:12.5px;line-height:1.5;box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;text-align:center;word-break:break-word}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:rgba(10,157,79,.95)}
.toast.err{background:rgba(214,69,69,.95)}
.toast.warn{background:rgba(232,176,75,.95);color:#1b1b1b}

@media(max-width:380px){
  .wrap{padding:12px}.md{font-size:16px}
  .pane-editor{padding:14px 16px 80px;font-size:15.5px}
  .pane-preview{padding:14px 16px 80px}
  .tree{padding:14px 14px 140px}.node-text{font-size:15px}
  .pane-mode button{padding:4px 7px;font-size:11.5px}
  .brand-title{display:none}
}
</style>

<script>
(function(){
'use strict';

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
const stampStr=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());};
const nowStr=()=>new Date().toLocaleString('zh-CN');
const safeName=s=>String(s||'未命名').replace(/[\\/:*?"<>|\r\n\t]/g,'_').replace(/^\.+/,'').slice(0,60)||'未命名';
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};};
const mkNode=(text,children)=>({id:uid(),text:text||'',collapsed:false,children:children||[]});

const FROM_OUTLINE='来自 Outline';

const COL_NOTE = 'note';
const COL_OUTLINE = 'outline';

function download(blob,name){
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=u;a.download=name;a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(u);},3000);
}
let toastT;
function toast(msg,type){
  const t=$('#toast');t.textContent=msg||'';
  t.className='toast show'+(type?' '+type:'');
  clearTimeout(toastT);
  toastT=setTimeout(()=>{t.className='toast'+(type?' '+type:'');},2200);
}
function ask(title,def){
  return new Promise(res=>{
    const m=$('#modal'),box=$('#mbox');
    box.innerHTML='<div class="mttl">'+esc(title)+'</div><input class="min" id="mIn" value="'+esc(def||'')+'">'
      +'<div class="mact"><button class="mbtn" data-c>取消</button><button class="mbtn p" data-k>确定</button></div>';
    m.classList.add('on');
    const inp=$('#mIn');setTimeout(()=>{inp.focus();inp.select();},30);
    let done=false;
    const fin=v=>{if(done)return;done=true;m.classList.remove('on');res(v);};
    box.querySelector('[data-c]').onclick=()=>fin(null);
    box.querySelector('[data-k]').onclick=()=>fin(inp.value);
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();fin(inp.value);}if(e.key==='Escape')fin(null);};
    m.onclick=e=>{if(e.target===m)fin(null);};
  });
}
function actionSheet(title,items){
  return new Promise(res=>{
    const m=$('#modal'),box=$('#mbox');

/* Markdown */
function mdToHtml(md){
  const blocks=[];
  md=String(md||'').replace(/```[^\n]*\n([\s\S]*?)```/g,(m,c)=>{blocks.push('<pre><code>'+esc(c)+'</code></pre>');return '\u0000'+(blocks.length-1)+'\u0000';});
  const inline=s=>{
    const codes=[];
    s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push('<code>'+esc(c)+'</code>');return '\u0001'+(codes.length-1)+'\u0001';});
    s=esc(s);
    s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,(m,a,src)=>'<img src="'+src+'" alt="'+a+'" loading="lazy" referrerpolicy="no-referrer">');
    s=s.replace(/\[\[([^\[\]]+?)\]\]/g,(m,i)=>{const p=i.split('|');const t=(p[0]||'').trim();return '<a class="wl" data-l="'+esc(t)+'">'+esc((p[1]||t).trim())+'</a>';});
    s=s.replace(/\[([^\[\]]+)\]\(([^)\s]+)[^)]*\)/g,(m,t,h)=>'<a href="'+h+'" target="_blank" rel="noopener">'+t+'</a>');
    s=s.replace(/(^|[\s(])#([\p{L}\p{N}_\/\-]+)/gu,(m,p,tag)=>p+'<a class="tg" data-t="'+esc(tag)+'">#'+esc(tag)+'</a>');
    s=s.replace(/==([^=\n]+?)==/g,'<mark>$1</mark>');
    s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>');
    s=s.replace(/~~([^~\n]+)~~/g,'<del>$1</del>');
    s=s.replace(/\u0001(\d+)\u0001/g,(m,i)=>codes[+i]);
    return s;
  };
  const lines=String(md).split('\n'),out=[];
  let lt=null,i=0;
  const close=()=>{if(lt){out.push('</'+lt+'>');lt=null;}};
  while(i<lines.length){
    const l=lines[i];
    if(/^\u0000\d+\u0000$/.test(l.trim())){close();out.push(l.trim());i++;continue;}
    if(!l.trim()){close();i++;continue;}
    if(/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(l)){close();out.push('<hr>');i++;continue;}
    let m=l.match(/^(#{1,6})\s+(.*)$/);
    if(m){close();out.push('<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>');i++;continue;}
    if(/^\s*>/.test(l)){
      close();const q=[];
      while(i<lines.length&&/^\s*>/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++;}
      out.push('<blockquote>'+inline(q.join('\n')).replace(/\n/g,'<br>')+'</blockquote>');
      continue;
    }
    if(/^\s*[-*+]\s+/.test(l)){
      if(lt!=='ul'){close();out.push('<ul>');lt='ul';}
      while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){out.push('<li>'+inline(lines[i].replace(/^\s*[-*+]\s+/,''))+'</li>');i++;}
      continue;
    }
    if(/^\s*\d+[.)]\s+/.test(l)){
      if(lt!=='ol'){close();out.push('<ol>');lt='ol';}
      while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){out.push('<li>'+inline(lines[i].replace(/^\s*\d+[.)]\s+/,''))+'</li>');i++;}
      continue;
    }
    close();
    const p=[l];i++;
    while(i<lines.length&&lines[i].trim()&&!/^\s*(#{1,6}\s|>|[-*+]\s|\d+[.)]\s|\u0000)/.test(lines[i])){p.push(lines[i]);i++;}
    out.push('<p>'+p.map(inline).join('<br>')+'</p>');
  }
  close();
  return out.join('\n').replace(/\u0000(\d+)\u0000/g,(m,x)=>blocks[+x]);
}
function mdToPlain(md){
  return String(md||'').replace(/```[\s\S]*?```/g,'')
    .replace(/!\[([^\]]*)\]\([^)]+\)/g,'$1')
    .replace(/\[\[([^\[\]]+?)\]\]/g,(m,i)=>{const p=i.split('|');return (p[1]||p[0]).trim();})
    .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/`([^`]+)`/g,'$1')
    .replace(/^#{1,6}\s+/gm,'').replace(/^\s*[-*+]\s+/gm,'')
    .replace(/^\s*\d+[.)]\s+/gm,'').replace(/^\s*>\s?/gm,'')
    .replace(/[*_~=]/g,'').replace(/\n{3,}/g,'\n\n').trim();
}
function mdToTree(md){
  const root={id:'__r__',text:'',collapsed:false,children:[],line:0};
  const stack=[{level:0,node:root}];
  let para=[],paraStart=0,inFence=false;
  const flush=()=>{
    if(!para.length)return;
    const text=para.join(' ').replace(/\s+/g,' ').trim();
    const start=paraStart;para=[];
    if(!text)return;
    while(stack.length>1&&stack[stack.length-1].level>=100)stack.pop();
    stack[stack.length-1].node.children.push({id:uid(),text,collapsed:false,children:[],line:start});
  };
  const lines=String(md||'').replace(/\r\n?/g,'\n').split('\n');
  for(let li=0;li<lines.length;li++){
    const rawLine=lines[li];const line=rawLine.replace(/\s+$/,'');const trimmed=line.trim();
    if(/^```/.test(trimmed)){inFence=!inFence;flush();continue;}
    if(inFence)continue;
    if(!trimmed){flush();continue;}
    const h=trimmed.match(/^(#{1,6})\s+(.+?)\s*#*\s*$/);
    if(h){
      flush();
      const level=h[1].length;const text=h[2].trim();
      const node={id:uid(),text,collapsed:false,children:[],line:li};
      while(stack.length>1&&stack[stack.length-1].level>=level)stack.pop();
      stack[stack.length-1].node.children.push(node);
      stack.push({level,node});
      continue;
    }
    const lm=line.match(/^(\s*)([-*+]|\d+[.)])\s+(.+)$/);
    if(lm){
      flush();
      const indent=(lm[1]||'').replace(/\t/g,'  ').length;
      const level=100+Math.floor(indent/2);
      const text=lm[3].trim().replace(/^\[[ xX]\]\s*/,'');
      const node={id:uid(),text,collapsed:false,children:[],line:li};
      while(stack.length>1&&stack[stack.length-1].level>=level)stack.pop();
      stack[stack.length-1].node.children.push(node);
      stack.push({level,node});
      continue;
    }
    if(!para.length)paraStart=li;
    para.push(trimmed.replace(/^>\s?/,''));
  }
  flush();
  return root;
}
function treeToMd(root,opts){
  const style=(opts&&opts.style)||'list';
  const out=[];
  if(style==='heading'){
    (function walk(n,depth){
      n.children.forEach(c=>{
        const lv=Math.min(depth+1,6);
        out.push('#'.repeat(lv)+' '+(c.text||''));out.push('');
        walk(c,depth+1);
      });
    })(root,0);
  }else{
    (function walk(n,depth){
      n.children.forEach(c=>{out.push('  '.repeat(depth)+'- '+(c.text||''));walk(c,depth+1);});
    })(root,0);
  }
  return out.join('\n').trim();
}

/* ===== 富文本编辑器：内容模型与 DOM 互转 ===== */

// 把 markdown 源码渲染成编辑器 DOM（图片变成真实 <img>）
function mdToEditableFrag(md){
  const frag=document.createDocumentFragment();
  const src=String(md||'');
  const re=/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g;
  let last=0,m;
  while((m=re.exec(src))){
    if(m.index>last)frag.appendChild(document.createTextNode(src.slice(last,m.index)));
    const img=document.createElement('img');
    img.setAttribute('src',m[2]);
    img.setAttribute('alt',m[1]||'图片');
    img.dataset.src=m[2];
    img.className='editor-img';
    img.setAttribute('loading','lazy');
    img.setAttribute('referrerpolicy','no-referrer');
    img.setAttribute('draggable','false');
    frag.appendChild(img);
    last=m.index+m[0].length;
  }
  if(last<src.length)frag.appendChild(document.createTextNode(src.slice(last)));
  return frag;
}
// 把编辑器 DOM 序列化回 markdown 源码
function editableToMd(root){
  let out='';
  (function walk(node){
    const kids=node.childNodes;
    for(let k=0;k<kids.length;k++){
      const c=kids[k];
      if(c.nodeType===3){
        out+=c.nodeValue;
      }else if(c.nodeType===1){
        const tag=c.nodeName;
        if(tag==='IMG'){
          const alt=c.getAttribute('alt')||'';
          const src=c.dataset.src||c.getAttribute('src')||'';
          out+='!['+alt+']('+src+')';
        }else if(tag==='BR'){
          out+='\n';
        }else if(tag==='DIV'||tag==='P'){
          if(out&&!out.endsWith('\n'))out+='\n';
          walk(c);
        }else{
          walk(c);
        }
      }
    }
  })(root);
  return out;
}
function setEditableContent(editorEl,md){
  editorEl.innerHTML='';
  const src=String(md||'');
  if(!src)return;
  editorEl.appendChild(mdToEditableFrag(src));
}
// 取编辑器光标在 markdown 源码中的字符偏移
function getCaretOffset(root){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount)return 0;
  const range=sel.getRangeAt(0);
  if(!root.contains(range.startContainer))return 0;
  const pre=range.cloneRange();
  pre.selectNodeContents(root);
  pre.setEnd(range.startContainer,range.startOffset);
  const tmp=document.createElement('div');
  tmp.appendChild(pre.cloneContents());
  return editableToMd(tmp).length;
}
// 把 markdown 源码偏移映射回编辑器光标
function setCaretByOffset(root,offset){
  const sel=window.getSelection();
  const range=document.createRange();
  let rem=offset,placed=false;
  function walk(node){
    if(placed)return;
    const kids=node.childNodes;
    for(let k=0;k<kids.length;k++){
      const c=kids[k];
      if(placed)return;
      if(c.nodeType===3){
        const len=c.nodeValue.length;
        if(rem<=len){range.setStart(c,rem);range.collapse(true);placed=true;return;}
        rem-=len;
      }else if(c.nodeType===1){
        const tag=c.nodeName;
        if(tag==='IMG'){
          const md='!['+(c.getAttribute('alt')||'')+']('+(c.dataset.src||c.getAttribute('src')||'')+')';
          const len=md.length;
          if(rem<=len){
            if(rem<len/2)range.setStartBefore(c);else range.setStartAfter(c);
            range.collapse(true);placed=true;return;
          }
          rem-=len;
        }else if(tag==='BR'){
          if(rem<=1){range.setStartAfter(c);range.collapse(true);placed=true;return;}
          rem-=1;
        }else{
          walk(c);
          if(placed)return;
        }
      }
    }
  }
  walk(root);
  if(!placed){range.selectNodeContents(root);range.collapse(false);}
  sel.removeAllRanges();sel.addRange(range);
}

/* Data 解析 */
const TAIL=['预览时标签不可点','喜欢此内容的人还喜欢','继续滑动看下一个','轻触阅读原文','分享收藏赞在看','写下你的留言','点击上方蓝字','点击下方名片','关注该公众号','长按识别二维码','微信扫一扫关注','往期回顾','往期推荐','往期精选','往期文章','相关阅读','更多精彩'];
const TAIL_S=new Set(['预览','点赞','在看','分享','收藏','留言','关注','扫描','长按','已同步','人划线','阅读原文','向上滑动','点击关注','点击上方','点击下方','长按识别','扫码关注','关注公众号','更多','收起','往期']);
const IMG_ATTRS=['data-src','data-original','data-backsrc','data-img','data-lazy-src','data-url','_src','data-actualsrc','data-cover','data-coversrc'];
function fixUrl(u){if(!u)return '';u=String(u).trim();if(u.startsWith('//'))u='https:'+u;return u.replace(/^http:/,'https:');}
function getImgSrc(img){
  for(const a of IMG_ATTRS){const v=img.getAttribute(a);if(v&&/^https?:|^\/\//.test(v)&&!/^data:/i.test(v))return v;}
  const s=img.getAttribute('src')||'';return /^data:/i.test(s)?'':s;
}
function htmlToMd(node){
  const walk=n=>{
    if(n.nodeType===3)return n.nodeValue.replace(/\s+/g,' ');
    if(n.nodeType!==1)return '';
    const tag=n.tagName.toLowerCase();const k=()=>Array.from(n.childNodes).map(walk).join('');
    switch(tag){
      case 'script':case 'style':case 'noscript':return '';
      case 'br':return '\n';
      case 'hr':return '\n\n---\n\n';
      case 'h1':return '\n\n# '+k().trim()+'\n\n';
      case 'h2':return '\n\n## '+k().trim()+'\n\n';
      case 'h3':return '\n\n### '+k().trim()+'\n\n';
      case 'h4':case 'h5':case 'h6':return '\n\n#### '+k().trim()+'\n\n';
      case 'p':case 'div':case 'section':case 'article':case 'figure':return '\n'+k()+'\n';
      case 'strong':case 'b':{const t=k().trim();return t?'**'+t+'**':'';}
      case 'em':case 'i':{const t=k().trim();return t?'*'+t+'*':'';}
      case 'code':return '`'+k()+'`';
      case 'pre':return '\n\n```\n'+n.textContent.trim()+'\n```\n\n';
      case 'blockquote':return '\n\n'+k().split('\n').map(l=>'> '+l).join('\n')+'\n\n';
      case 'ul':case 'ol':return '\n'+k()+'\n';
      case 'li':return '- '+k().trim()+'\n';
      case 'a':{const h=n.getAttribute('href')||'',t=k().trim();return t?(h&&!h.startsWith('#')?'['+t+']('+h+')':t):'';}
      case 'img':{const s=n.getAttribute('src')||'',a=n.getAttribute('alt')||'';return s?'\n\n!['+a+']('+s+')\n\n':'';}
      case 'iframe':{const s=n.getAttribute('src')||'';return s?'\n\n[▶ 嵌入内容]('+s+')\n\n':'';}
      case 'video':{let v=n.getAttribute('src')||'';if(!v){const s=n.querySelector('source');if(s)v=s.getAttribute('src')||'';}return v?'\n\n[▶ 视频]('+v+')\n\n':'';}
      case 'tr':return '| '+Array.from(n.children).map(td=>walk(td).trim()).join(' | ')+' |\n';
      case 'td':case 'th':return k();
      default:return k();
    }
  };
  return walk(node).replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function cleanNode(root){
  root.querySelectorAll('script,style,noscript,link,meta,svg,.js_ad_link,#js_pc_qr_code,.rich_media_tool,.reward_area').forEach(n=>n.remove());
  root.querySelectorAll('iframe').forEach(f=>{
    const s=f.getAttribute('src')||f.getAttribute('data-src')||'';
    if(!s){f.remove();return;}
    f.setAttribute('src',s);f.removeAttribute('class');f.removeAttribute('style');
    f.setAttribute('loading','lazy');f.setAttribute('referrerpolicy','no-referrer');
  });
  root.querySelectorAll('video').forEach(v=>{
    let s=v.getAttribute('src')||v.getAttribute('data-src')||'';
    if(!s){const src=v.querySelector('source');if(src)s=src.getAttribute('src')||src.getAttribute('data-src')||'';}
    if(s)v.setAttribute('src',s);
    v.removeAttribute('class');v.removeAttribute('style');
    v.setAttribute('controls','');v.setAttribute('playsinline','');
  });
  root.querySelectorAll('img').forEach(img=>{
    const s=fixUrl(getImgSrc(img));
    IMG_ATTRS.concat(['class','id','style','data-ratio','data-w']).forEach(a=>img.removeAttribute(a));
    if(!s){img.remove();return;}
    img.setAttribute('src',s);img.setAttribute('loading','lazy');img.setAttribute('referrerpolicy','no-referrer');
  });
  root.querySelectorAll('*').forEach(n=>{
    if(!/^(IMG|IFRAME|VIDEO)$/.test(n.tagName)){n.removeAttribute('class');n.removeAttribute('id');n.removeAttribute('style');}
  });
  return root;
}
function trimTail(root){
  (function proc(p){
    const ch=Array.from(p.children);
    for(let i=ch.length-1;i>=0;i--){
      const c=ch[i];proc(c);
      if(/^(IFRAME|VIDEO|IMG)$/.test(c.tagName))continue;
      if(c.querySelector&&c.querySelector('iframe,video,img'))continue;
      const t=c.textContent.replace(/\s+/g,'').trim();
      if(!t)continue;
      if(TAIL.some(x=>t.includes(x))||(t.length<=12&&TAIL_S.has(t))){c.remove();continue;}
      break;
    }
  })(root);
}
function parsePlain(text,srcUrl){
  const raw=String(text||'').replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ').trim();
  if(!raw)throw new Error('内容为空');
  const lines=raw.split('\n').map(s=>s.trim());
  while(lines.length&&!lines[lines.length-1])lines.pop();
  const isTail=l=>!l||TAIL.some(x=>l.includes(x))||(l.length<=12&&TAIL_S.has(l));
  while(lines.length&&isTail(lines[lines.length-1]))lines.pop();
  const first=lines.find(l=>l)||'';
  let title='',start=0;const fi=lines.indexOf(first);
  if(lines.filter(Boolean).length>1&&first.length<=80&&!/[。！？；：，、,]$/.test(first)){title=first;start=fi+1;}
  if(!title)title=first.slice(0,80)||'无标题';
  const paras=[],cur=[];
  for(let i=start;i<lines.length;i++){if(!lines[i]){if(cur.length){paras.push(cur.join(''));cur.length=0;}}else cur.push(lines[i]);}
  if(cur.length)paras.push(cur.join(''));
  const list=paras.length?paras:[lines.filter(Boolean).join('')];
  const plain=list.join('\n\n');
  return {title,markdown:'# '+title+'\n\n'+plain,url:srcUrl||'',chars:plain.replace(/\s/g,'').length};
}
function buildArticle(html,text,srcUrl){
  html=String(html||'').trim();text=String(text||'').trim();
  if(html&&/<(p|div|section|article|img|iframe|video|h[1-6])[\s>]/i.test(html)){
    try{
      const doc=new DOMParser().parseFromString(html,'text/html');
      const body=doc.querySelector('#js_content,.rich_media_content,article')||doc.body;
      if(body&&(body.textContent.trim()||body.querySelector('img,iframe,video'))){
        const clone=cleanNode(body.cloneNode(true));trimTail(clone);
        const tEl=doc.querySelector('#activity-name')||doc.querySelector('h1.rich_media_title');
        let title=(tEl?tEl.textContent:doc.title||'').replace(/\s+/g,' ').replace(/\s*[-|–]\s*微信公众平台\s*$/i,'').trim();
        const md=htmlToMd(clone);
        const plain=clone.textContent.replace(/\n{3,}/g,'\n\n').trim();
        if((md.length>20||plain.length>20)&&!doc.querySelector('.weui-msg')){
          if(!title||title.length>150)title=(plain.split('\n').find(l=>l.trim())||'').slice(0,80);
          return {title:title||'无标题',markdown:md,url:srcUrl||'',chars:plain.replace(/\s/g,'').length};
        }
      }
    }catch(e){}
  }
  return parsePlain(text||html.replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&'),srcUrl);
}

  async init(){
    if(!this.has())return false;
    if(typeof cloudbase==='undefined')return false;
    try{
      this.app=cloudbase.init({env:this.cfg.envId,accessKey:this.cfg.accessKey});
      const a=this.app.auth({persistence:'local'});
      if(!a.hasLoginState())await a.signInAnonymously();
      this.db=this.app.database();this.ready=true;return true;
    }catch(e){console.error('[CloudBase init]',e);this.ready=false;return false;}
  },
  async sync(colName,items,tombs){
    if(!this.has())return null;
    if(!this.ready&&!await this.init())return null;
    if(this.busy)return null;
    this.busy=true;
    try{
      const col=this.db.collection(colName);
      const up=[];
      items.forEach(it=>up.push(col.doc(it.id).set(Object.assign({},it,{deleted:false}))));
      Object.keys(tombs||{}).forEach(id=>up.push(col.doc(id).set({id,updated:tombs[id],deleted:true})));
      if(up.length)await Promise.all(up);
      const remote=[];let skip=0;
      while(true){
        const r=await col.skip(skip).limit(100).get();
        const l=(r&&r.data)||[];remote.push.apply(remote,l);
        if(l.length<100)break;skip+=100;if(skip>3000)break;
      }
      const map=new Map(items.map(i=>[i.id,i]));
      const tm=Object.assign({},tombs||{});
      remote.forEach(d=>{
        const id=d.id||d._id;if(!id)return;
        const rU=Number(d.updated||0),rD=!!d.deleted;
        const loc=map.get(id);const lU=loc?Number(loc.updated||0):-1;const pt=Number(tm[id]||0);
        if(rD){if(rU>=lU&&rU>=pt){tm[id]=rU;map.delete(id);}return;}
        if(rU<pt)return;
        if(loc&&rU<=lU)return;
        const c=Object.assign({},d);delete c.id;delete c._id;delete c.deleted;
        map.set(id,Object.assign(c,{id:id,updated:rU}));
        delete tm[id];
      });
      return {items:Array.from(map.values()),tombs:tm};
    }catch(e){console.error('[CloudBase sync]',e);return null;}
    finally{this.busy=false;}
  }
};

/* ===== 图片插入 ===== */
let imgTarget=null;

function readFileAsDataURL(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(String(r.result||''));
    r.onerror=()=>rej(new Error('读取失败'));
    r.readAsDataURL(file);
  });
}
function loadImgEl(src){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>res(im);
    im.onerror=()=>rej(new Error('图片解码失败'));
    im.src=src;
  });
}
async function imageToDataUrl(file){
  const type=file.type||'';
  if(!/^image\//.test(type))throw new Error('不是图片文件');
  const raw=await readFileAsDataURL(file);
  if(type==='image/svg+xml')return raw;
  if(type==='image/gif'&&file.size<=1200*1024)return raw;
  const img=await loadImgEl(raw);
  let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
  if(!w||!h)throw new Error('图片尺寸异常');
  const MAX=1400;
  const k=Math.min(1,MAX/Math.max(w,h));
  w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
  const cv=document.createElement('canvas');
  cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
  ctx.drawImage(img,0,0,w,h);
  let out='',q=0.86;
  try{
    out=cv.toDataURL('image/jpeg',q);
    while(out.length>700*1024&&q>0.5){q-=0.08;out=cv.toDataURL('image/jpeg',q);}
  }catch(e){out='';}
  if(!out)return raw;
  if(out.length>raw.length&&raw.length<600*1024)return raw;
  return out;
}

  }
  const editorEl=panesEl[paneIdx].querySelector('.pane-editor');
  const safeAlt=String(alt||'图片').replace(/[\[\]()\n\r]/g,'').trim().slice(0,50)||'图片';

  const img=document.createElement('img');
  img.setAttribute('src',url);
  img.setAttribute('alt',safeAlt);
  img.dataset.src=url;
  img.className='editor-img';
  img.setAttribute('loading','lazy');
  img.setAttribute('referrerpolicy','no-referrer');
  img.setAttribute('draggable','false');

  // 确定插入位置：优先使用保存的光标
  editorEl.focus();
  const sel=window.getSelection();
  let range=null;
  const sr=savedRanges[paneIdx];
  if(sr&&sr.startContainer&&sr.startContainer.isConnected&&editorEl.contains(sr.startContainer)){
    range=sr.cloneRange();
  }else if(sel&&sel.rangeCount&&editorEl.contains(sel.anchorNode)){
    range=sel.getRangeAt(0).cloneRange();
  }else{
    range=document.createRange();
    range.selectNodeContents(editorEl);
    range.collapse(false);
  }
  range.deleteContents();

  const before=document.createTextNode('\n');
  const after=document.createTextNode('\n');
  const frag=document.createDocumentFragment();
  frag.appendChild(before);
  frag.appendChild(img);
  frag.appendChild(after);
  range.insertNode(frag);

  // 光标移到图片之后
  const r2=document.createRange();
  r2.setStartAfter(after);
  r2.collapse(true);
  sel.removeAllRanges();
  sel.addRange(r2);
  savedRanges[paneIdx]=r2.cloneRange();

  // 同步内容模型
  note.content=editableToMd(editorEl);
  note.updated=Date.now();

  // 同步另一个同文章的窗格
  panesEl.forEach((p2,j)=>{
    if(j===paneIdx)return;
    if(nState.panes[j].noteId!==note.id)return;
    if(nState.panes[j].mode==='edit'){
      const e2=p2.querySelector('.pane-editor');
      if(document.activeElement!==e2)setEditableContent(e2,note.content);
    }else if(nState.panes[j].mode==='read'){
      p2.querySelector('.pane-preview').innerHTML=note.content
        ?mdToHtml(note.content):'<p style="color:var(--faint);padding:20px">暂无内容</p>';
    }else if(nState.panes[j].mode==='outline'){
      renderPaneOutline(j);
    }
  });
  nSaveSoon();

  // 出现动画 + 滚动到可见
  img.classList.add('fresh');
  setTimeout(()=>img.classList.remove('fresh'),1300);
  setTimeout(()=>{
    try{img.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){}
  },80);

  imgTarget=null;
}
async function insertImageFile(paneIdx,file){
  if(!file)return;
  if(!/^image\//.test(file.type||'')){toast('请选择图片文件','err');return;}
  if(file.size>15*1024*1024){toast('图片过大（超过 15MB）','err');return;}
  toast('正在处理图片…');
  try{
    const url=await imageToDataUrl(file);
    const alt=(file.name||'图片').replace(/\.[^.]+$/,'')||'图片';
    insertImageInto(paneIdx,url,alt);
    const kb=Math.round(url.length*0.75/1024);
    if(kb>600)toast('已插入图片（约 '+kb+'KB，注意本地存储上限）','warn');
    else toast('✓ 图片已显示在正文中','ok');
  }catch(err){
    console.error(err);
    toast('图片插入失败：'+(err.message||'未知错误'),'err');
  }
}

panesEl.forEach((el,i)=>{
  const titleEl=el.querySelector('.pane-title');
  const editorEl=el.querySelector('.pane-editor');
  const previewEl=el.querySelector('.pane-preview');

  const saveSel=()=>{
    const sel=window.getSelection();
    if(sel&&sel.rangeCount){
      const r=sel.getRangeAt(0);
      if(editorEl.contains(r.startContainer)){
        savedRanges[i]=r.cloneRange();
      }
    }
  };

  const setFocus=()=>{

    }else if(nState.panes[i].mode==='outline'){
      renderPaneOutline(i);
    }
    nSaveSoon();
  };

  // 选区记录
  editorEl.addEventListener('keyup',saveSel);
  editorEl.addEventListener('mouseup',saveSel);
  editorEl.addEventListener('blur',saveSel);
  editorEl.addEventListener('focus',saveSel);

  // 回车插入纯换行，保持编辑器 DOM 扁平
  editorEl.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.isComposing){
      e.preventDefault();
      document.execCommand('insertText',false,'\n');
      return;
    }
    if(e.key==='Tab'){
      e.preventDefault();
      document.execCommand('insertText',false,'  ');
      return;
    }
  });

  // 粘贴：图片走插入流程，文本走纯文本插入
  editorEl.addEventListener('paste',e=>{
    const dt=e.clipboardData;
    if(!dt)return;
    if(dt.items){
      for(let k=0;k<dt.items.length;k++){
        const it=dt.items[k];
        if(it.kind==='file'&&/^image\//.test(it.type||'')){
          e.preventDefault();
          const f=it.getAsFile();
          if(f){
            saveSel();
            insertImageFile(i,f);
          }
          return;
        }
      }
    }
    e.preventDefault();
    const txt=dt.getData('text/plain')||'';
    document.execCommand('insertText',false,txt);
  });

  // 拖入图片
  editorEl.addEventListener('dragover',e=>{
    const dt=e.dataTransfer;
    if(!dt)return;
    const types=Array.from(dt.types||[]);
    if(types.indexOf('Files')>-1)e.preventDefault();
  });
  editorEl.addEventListener('drop',e=>{
    const dt=e.dataTransfer;
    if(!dt||!dt.files||!dt.files.length)return;
    const f=Array.from(dt.files).find(x=>/^image\//.test(x.type||''));
    if(!f)return;
    e.preventDefault();
    if(document.caretRangeFromPoint){
      try{
        const r=document.caretRangeFromPoint(e.clientX,e.clientY);
        if(r&&editorEl.contains(r.startContainer)){
          const sel=window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
        }
      }catch(err){}
    }
    saveSel();
    insertImageFile(i,f);
  });

  el.querySelectorAll('.pane-mode button').forEach(b=>b.onclick=()=>{
    nState.panes[i].mode=b.dataset.m;
    renderPane(i);nSave();
  });
  previewEl.onclick=e=>{
    const w=e.target.closest('.wl');
    if(w){

      const found=nState.notes.find(n=>(n.title||'').trim().toLowerCase()===t.trim().toLowerCase());
      if(found)openNote(found.id,i);
      else{

        nState.notes.unshift(n);openNote(n.id,i);
        toast('已创建「'+t+'」');
      }
      return;
    }
    const tg=e.target.closest('.tg');
    if(tg){
      e.preventDefault();
      const tag=tg.dataset.t;
      const hits=nState.notes.filter(n=>(n.content||'').includes('#'+tag));
      toast('标签 #'+tag+' 共 '+hits.length+' 篇',3000);
    }
  };
});

$('#nGraph').onclick=()=>{
  const overlay=$('#modal');
  $('#mbox').innerHTML='<div class="mttl">知识图谱</div>'
    +'<div id="gWrap" style="position:relative;width:100%;height:56vh;background:var(--bg);border:1px solid var(--bd);border-radius:10px;overflow:hidden">'
    +'<canvas id="gCv" style="width:100%;height:100%;display:block;touch-action:none"></canvas></div>'
    +'<div class="mdesc" style="margin:10px 0 0;font-size:11.5px">拖动节点 · 点击节点在当前窗格打开</div>'
    +'<div class="mact" style="margin-top:14px"><button class="mbtn" data-c>关闭</button></div>';
  overlay.classList.add('on');
  overlay.querySelector('.mbox').style.maxWidth='600px';
  const cv=$('#gCv'),wrap=$('#gWrap');
  const dpr=window.devicePixelRatio||1;
  const W=wrap.clientWidth,H=wrap.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const R=Math.min(W,H)*0.3;
  const nodes=nState.notes.map((n,i)=>{
    const a=(i/Math.max(1,nState.notes.length))*Math.PI*2;
    return{id:n.id,label:n.title||'无标题',x:W/2+Math.cos(a)*R,y:H/2+Math.sin(a)*R,vx:0,vy:0};
  });
  const nm=new Map(nodes.map(n=>[n.id,n]));
  const links=[],seen=new Set();
  nState.notes.forEach(n=>{
    const re=/\[\[([^\[\]]+?)\]\]/g;let m;
    while((m=re.exec(n.content||''))){
      const t=m[1].split('|')[0].trim().toLowerCase();
      const tg=nState.notes.find(x=>(x.title||'').trim().toLowerCase()===t);
      if(!tg||tg.id===n.id)continue;
      const k=[n.id,tg.id].sort().join('|');
      if(seen.has(k))continue;
      seen.add(k);links.push({s:n.id,t:tg.id});
    }
  });
  let dg=null,raf=null;
  cv.onpointerdown=e=>{
    const r=cv.getBoundingClientRect();
    const x=e.clientX-r.left,y=e.clientY-r.top;
    const hit=nodes.find(n=>Math.hypot(n.x-x,n.y-y)<26);
    if(hit){dg=hit;try{cv.setPointerCapture(e.pointerId);}catch(err){}}
  };
  cv.onpointermove=e=>{
    if(!dg)return;
    const r=cv.getBoundingClientRect();
    dg.x=e.clientX-r.left;dg.y=e.clientY-r.top;dg.vx=dg.vy=0;
  };
  cv.onpointerup=e=>{
    if(!dg)return;
    const r=cv.getBoundingClientRect();
    const x=e.clientX-r.left,y=e.clientY-r.top;
    const hit=nodes.find(n=>Math.hypot(n.x-x,n.y-y)<26);
    const same=dg===hit;dg=null;
    if(same&&hit){
      overlay.classList.remove('on');cancelAnimationFrame(raf);
      openNote(hit.id,nState.focus);
    }
  };
  function loop(){
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];
      let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
      if(d2<1){dx=Math.random()-.5;dy=Math.random()-.5;d2=1;}
      const d=Math.sqrt(d2),f=5200/d2,fx=dx/d*f,fy=dy/d*f;
      a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
    }
    links.forEach(l=>{
      const a=nm.get(l.s),b=nm.get(l.t);if(!a||!b)return;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01;
      const f=(d-120)*0.012,fx=dx/d*f,fy=dy/d*f;
      a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
    });
    nodes.forEach(n=>{
      if(n===dg){n.vx=n.vy=0;return;}
      n.vx+=(W/2-n.x)*0.0035;n.vy+=(H/2-n.y)*0.0035;
      n.vx*=.86;n.vy*=.86;
      n.x=Math.max(24,Math.min(W-24,n.x+n.vx));
      n.y=Math.max(24,Math.min(H-24,n.y+n.vy));
    });
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(168,130,255,.24)';ctx.lineWidth=1;
    links.forEach(l=>{
      const a=nm.get(l.s),b=nm.get(l.t);if(!a||!b)return;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    });
    const curId=nState.panes[nState.focus].noteId;
    nodes.forEach(n=>{
      const act=n.id===curId;
      ctx.beginPath();ctx.arc(n.x,n.y,act?9:6,0,Math.PI*2);
      ctx.fillStyle=act?'#a882ff':'#6b6b8a';ctx.fill();
      ctx.fillStyle=act?'#e8e0ff':'#9a9a9a';
      ctx.font='12px sans-serif';ctx.textAlign='center';
      ctx.fillText(n.label.slice(0,10),n.x,n.y-14);
    });
    raf=requestAnimationFrame(loop);
  }
  loop();
  const close=()=>{cancelAnimationFrame(raf);overlay.classList.remove('on');};
  $('#mbox [data-c]').onclick=close;
  overlay.onclick=ev=>{if(ev.target===overlay)close();};
};

/* Outline */
function oLocate(id,node,parent){
  node=node||oRoot;if(!node)return null;
  if(node.id===id)return{node,parent:parent||null,index:parent?parent.children.indexOf(node):-1};
  for(let i=0;i<node.children.length;i++){
    const r=oLocate(id,node.children[i],node);
    if(r)return r;
  }
  return null;
}
const oTreeEl=$('#oTree'),oScrollEl=$('#oScroll');
function updateBullet(b,n){
  b.innerHTML='<i></i>';
  if(n.children.length){
    b.classList.add('hc');b.dataset.c=n.children.length;
    b.classList.toggle('cl',n.collapsed);
  }else{b.classList.remove('hc','cl');delete b.dataset.c;}
}
function renderNode(n){
  const wrap=document.createElement('div');
  wrap.className='node'+(n.collapsed?' collapsed':'');
  wrap.dataset.id=n.id;
  const row=document.createElement('div');row.className='node-row';
  const b=document.createElement('span');b.className='bullet';updateBullet(b,n);
  const t=document.createElement('div');
  t.className='node-text';t.contentEditable='true';t.spellcheck=false;
  t.textContent=n.text;
  row.appendChild(b);row.appendChild(t);
  wrap.appendChild(row);
  if(n.children.length){
    const kids=document.createElement('div');kids.className='node-children';
    n.children.forEach(c=>kids.appendChild(renderNode(c)));
    wrap.appendChild(kids);
  }
  return wrap;
}
function oRender(){
  const st=oScrollEl.scrollTop;
  oTreeEl.innerHTML='';
  if(oRoot&&oRoot.children&&oRoot.children.length){
    oRoot.children.forEach(c=>oTreeEl.appendChild(renderNode(c)));
  }else{
    oTreeEl.innerHTML='<div class="ot-hint" style="text-align:center;padding:24px 8px">还没有大纲节点<br>点底栏 ＋ 添加一个</div>';
  }
  oScrollEl.scrollTop=st;
}
function oFocusNode(id,caret){
  const el=oTreeEl.querySelector('.node[data-id="'+id+'"] > .node-row > .node-text');
  if(!el)return;
  el.focus();
  const len=el.textContent.length;
  const off=caret<0?len:Math.min(caret||0,len);
  const sel=window.getSelection();const range=document.createRange();
  let rem=off,tn=null;
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);
  while(w.nextNode()){
    const node=w.currentNode;
    if(rem<=node.length){tn=node;break;}
    rem-=node.length;
  }
  if(tn){range.setStart(tn,rem);range.collapse(true);}
  else{range.selectNodeContents(el);range.collapse(false);}
  sel.removeAllRanges();sel.addRange(range);
}
function oCaretOffset(el){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount)return 0;
  const r=sel.getRangeAt(0);
  if(!el.contains(r.startContainer))return 0;
  const pre=r.cloneRange();pre.selectNodeContents(el);
  pre.setEnd(r.startContainer,r.startOffset);

function oVisibleIds(){
  const out=[];
  (function w(n){n.children.forEach(c=>{out.push(c.id);if(!c.collapsed)w(c);});})(oRoot);
  return out;
}
function oHandleEnter(textEl){
  const id=textEl.closest('.node').dataset.id;
  const loc=oLocate(id);if(!loc)return;
  const c=oCaretOffset(textEl);
  const before=loc.node.text.slice(0,c);const after=loc.node.text.slice(c);
  loc.node.text=before;loc.node.collapsed=false;
  const nn=mkNode(after);
  loc.parent.children.splice(loc.index+1,0,nn);
  oRender();oFocusNode(nn.id,0);oSave();
}
function oDeleteEmpty(id){
  const loc=oLocate(id);if(!loc)return;
  const ids=oVisibleIds();const idx=ids.indexOf(id);
  const prev=idx>0?ids[idx-1]:null;
  if(loc.parent===oRoot&&oRoot.children.length===1){loc.node.text='';return;}
  loc.parent.children.splice(loc.index,1,...loc.node.children);
  oRender();

oTreeEl.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('.node-text');if(!t)return;
  const id=t.closest('.node').dataset.id;
  const loc=oLocate(id);if(!loc)return;
  const c=oCaretOffset(t),len=t.textContent.length;
  if(e.key==='Enter'&&!e.isComposing){e.preventDefault();oHandleEnter(t);return;}
  if(e.key==='Tab'){
    e.preventDefault();
    let ok=false;
    if(e.shiftKey){
      if(loc.parent&&loc.parent!==oRoot){
        const pl=oLocate(loc.parent.id);
        if(pl&&pl.parent){
          loc.parent.children.splice(loc.index,1);
          pl.parent.children.splice(pl.index+1,0,loc.node);
          ok=true;
        }
      }
    }else if(loc.index>0){
      const prev=loc.parent.children[loc.index-1];
      loc.parent.children.splice(loc.index,1);
      prev.children.push(loc.node);prev.collapsed=false;
      ok=true;
    }
    if(ok){oRender();oFocusNode(id,c);oSave();}
    return;
  }
  if(e.key==='Backspace'&&c===0&&len===0){e.preventDefault();oDeleteEmpty(id);return;}
  if(e.key==='ArrowUp'&&c===0){
    const ids=oVisibleIds();const i=ids.indexOf(id);
    if(i>0){e.preventDefault();oFocusNode(ids[i-1],-1);}
    return;
  }
  if(e.key==='ArrowDown'&&c===len){
    const ids=oVisibleIds();const i=ids.indexOf(id);
    if(i>-1&&i<ids.length-1){e.preventDefault();oFocusNode(ids[i+1],0);}
  }
});

const mmView=$('#mmView'),mmStage=$('#mmStage');

function applyT(){mmStage.style.transform='translate('+mmState.panX+'px,'+mmState.panY+'px) scale('+mmState.scale+')';}
function fitMap(){
  const vw=mmView.clientWidth||360,vh=mmView.clientHeight||480;const pad=60;
  let s=Math.min((vw-pad)/mmContent.w,(vh-pad)/mmContent.h);
  s=Math.max(0.12,Math.min(1.1,s));

  mmState.panX=(vw-mmContent.w*s)/2;mmState.panY=(vh-mmContent.h*s)/2;

function buildActions(n){

function renderMap(){
  if(!oRoot){mmStage.innerHTML='';mmContent.w=1;mmContent.h=1;return;}
  if(mmView.clientWidth===0||mmView.clientHeight===0){setTimeout(renderMap,120);return;}
  if(mmEdit)return;
  mmStage.innerHTML='';
  const center={id:'__c__',text:$('#oTitle').value.trim()||'中心主题',collapsed:false,children:oRoot.children,isCenter:true};
  const nodes=[];
  (function build(n){
    const el=document.createElement('div');
    el.className='mm-node'+(n.isCenter?' center':'');
    el.dataset.id=n.id;
    const txt=document.createElement('span');
    txt.className='mm-text';
    txt.textContent=n.text||(n.isCenter?'':'（空）');
    el.appendChild(txt);
    if(!n.isCenter&&n.children.length){
      const tg=document.createElement('span');
      tg.className='mm-toggle';
      tg.textContent=n.collapsed?'＋':'－';
      tg.addEventListener('click',ev=>{
        ev.stopPropagation();ev.preventDefault();
        const r=oLocate(n.id);
        if(r&&r.node.children.length){r.node.collapsed=!r.node.collapsed;oSave();renderMap();}
      });
      el.appendChild(tg);
    }
    el.appendChild(buildActions(n));
    n._el=el;mmStage.appendChild(el);nodes.push(n);
    if(!n.collapsed)n.children.forEach(build);
  })(center);
  nodes.forEach(n=>{n._w=n._el.offsetWidth||80;n._h=n._el.offsetHeight||32;});
  const GAP=16;let cy=0;
  (function assignY(n){
    if(n.collapsed||!n.children.length){n._y=cy+n._h/2;cy+=n._h+GAP;}
    else{
      n.children.forEach(assignY);
      n._y=(n.children[0]._y+n.children[n.children.length-1]._y)/2;
    }
  })(center);
  const GX=60;center._x=0;
  (function assignX(n){n.children.forEach(c=>{c._x=n._x+n._w+GX;assignX(c);});})(center);
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  nodes.forEach(n=>{
    minX=Math.min(minX,n._x);minY=Math.min(minY,n._y-n._h/2);
    maxX=Math.max(maxX,n._x+n._w);maxY=Math.max(maxY,n._y+n._h/2);
  });
  const PAD=48;const offX=PAD-minX,offY=PAD-minY;
  const W=maxX-minX+PAD*2,H=maxY-minY+PAD*2;
  mmContent.w=W;mmContent.h=H;
  mmStage.style.width=W+'px';mmStage.style.height=H+'px';
  nodes.forEach(n=>{
    n._el.style.left=(n._x+offX)+'px';
    n._el.style.top=(n._y-n._h/2+offY)+'px';
  });
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('class','mm-svg');
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  mmStage.appendChild(svg);
  (function draw(n){
    n.children.forEach(c=>{
      const x1=n._x+n._w+offX,y1=n._y+offY,x2=c._x+offX,y2=c._y+offY;
      const mx=(x1+x2)/2;
      const p=document.createElementNS(NS,'path');
      p.setAttribute('d','M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2);
      p.setAttribute('class','mm-link');svg.appendChild(p);
      draw(c);
    });
  })(center);
  if(mmSel&&nodes.some(n=>n.id===mmSel)){
    const el=nodes.find(n=>n.id===mmSel)._el;el.classList.add('sel');
  }else mmSel=null;
  if(!mmInited){mmInited=true;fitMap();}
  else applyT();
}
function startEdit(id){

let pointers=new Map(),drag=null,pinch=null,lastClick=0,lastId=null,pendingRender=false;
mmView.addEventListener('pointerdown',e=>{
  if(mmEdit){
    const el=mmStage.querySelector('.mm-node[data-id="'+mmEdit+'"]');
    if(el&&el.contains(e.target))return;
    endEdit(true);pendingRender=true;
  }
  if(e.target.closest&&(e.target.closest('.mm-act')||e.target.closest('.mm-toggle')))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    drag={px:mmState.panX,py:mmState.panY,sx:e.clientX,sy:e.clientY,moved:false};
    pinch=null;
  }else if(pointers.size===2){
    const pts=Array.from(pointers.values());
    const r=mmView.getBoundingClientRect();
    pinch={d:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1,
      s:mmState.scale,px:mmState.panX,py:mmState.panY,
      cx:(pts[0].x+pts[1].x)/2-r.left,cy:(pts[0].y+pts[1].y)/2-r.top};
    drag=null;
  }
});
document.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1&&drag){
    const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved&&(Math.abs(dx)>5||Math.abs(dy)>5))drag.moved=true;
    if(drag.moved){mmState.panX=drag.px+dx;mmState.panY=drag.py+dy;applyT();}
  }else if(pointers.size===2&&pinch){
    const pts=Array.from(pointers.values());
    const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1;
    let ns=pinch.s*(d/pinch.d);
    ns=Math.max(0.12,Math.min(3.2,ns));
    const k=ns/pinch.s;
    mmState.panX=pinch.cx-(pinch.cx-pinch.px)*k;
    mmState.panY=pinch.cy-(pinch.cy-pinch.py)*k;
    mmState.scale=ns;applyT();
  }
});
document.addEventListener('pointerup',e=>{
  if(!pointers.has(e.pointerId))return;
  const wasDrag=drag&&drag.moved;
  pointers.delete(e.pointerId);
  if(pointers.size===0){drag=null;pinch=null;}
  if(pointers.size>0||wasDrag)return;
  const elAt=document.elementFromPoint(e.clientX,e.clientY);
  if(elAt&&elAt.closest&&(elAt.closest('.mm-act')||elAt.closest('.mm-toggle')))return;
  if(pendingRender){pendingRender=false;renderMap();}
  const nodeEl=elAt&&elAt.closest&&elAt.closest('.mm-node');
  if(!nodeEl){
    if(mmSel){mmSel=null;mmStage.querySelectorAll('.mm-node.sel').forEach(x=>x.classList.remove('sel'));}
    return;
  }
  const id=nodeEl.dataset.id;
  const now=Date.now();
  if(lastId===id&&now-lastClick<350){
    lastId=null;lastClick=0;
    mmSel=id;
    mmStage.querySelectorAll('.mm-node.sel').forEach(x=>x.classList.remove('sel'));
    nodeEl.classList.add('sel');startEdit(id);return;
  }
  lastId=id;lastClick=now;mmSel=id;
  mmStage.querySelectorAll('.mm-node.sel').forEach(x=>x.classList.remove('sel'));
  nodeEl.classList.add('sel');
});
document.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);drag=null;pinch=null;});

function handleData(cd){

  const g=k=>cd.getData?cd.getData(k)||'':'';
  const html=g('text/html'),text=g('text/plain'),url=g('text/uri-list');
  if(!html&&!text){setStatus('剪贴板里没有文本内容','warn');return;}

      const a=buildArticle(html,text,(url||'').trim());
      renderPreview(a);setStatus('✓ 解析成功 · '+a.chars+' 字','ok');
    }catch(e){console.error(e);setStatus('解析失败：'+e.message,'err');}
  },20);
}
pasteEl.addEventListener('paste',e=>{e.preventDefault();pasteEl.value='';handleData(e.clipboardData||window.clipboardData);});
pasteEl.addEventListener('input',()=>{pasteEl.value='';});
pasteEl.addEventListener('keydown',e=>{if(e.key!=='Tab')e.preventDefault();});
document.addEventListener('paste',e=>{
  if(curMod!=='data')return;
  const tag=(e.target&&e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea')return;
  if(!e.clipboardData)return;
  const h=e.clipboardData.getData('text/html'),t=e.clipboardData.getData('text/plain');
  if(!h&&!t)return;e.preventDefault();handleData(e.clipboardData);
});
$('#readClip').onclick=async()=>{
  if(navigator.clipboard&&navigator.clipboard.read){
    try{
      const items=await navigator.clipboard.read();let html='',text='',url='';
      for(const it of items){
        if(it.types.includes('text/html'))html=await (await it.getType('text/html')).text();
        if(it.types.includes('text/plain'))text=await (await it.getType('text/plain')).text();
        if(it.types.includes('text/uri-list'))url=await (await it.getType('text/uri-list')).text();
      }
      handleData({getData:k=>k==='text/html'?html:k==='text/plain'?text:k==='text/uri-list'?url:''});
      return;
    }catch(e){}
  }
  try{
    const text=await navigator.clipboard.readText();
    if(!text){setStatus('剪贴板为空','warn');return;}
    handleData({getData:k=>k==='text/plain'?text:''});
  }catch(e){setStatus('无法读取剪贴板，请长按虚线框粘贴','err');pasteEl.focus();}
};
$('#clearBtn').onclick=()=>{pasteEl.value='';resetPreview();setStatus('');pasteEl.focus();};

/* 备份 / 恢复 */
function syncAll(){nSync();oSync();}
$('#expBtn').onclick=async()=>{
  const allArticles=nState.notes.map(n=>({id:n.id,title:n.title,folder:n.folder,content:n.content,updated:n.updated}));
  const allDocs=Object.keys(oDocs).map(id=>oDocs[id]);
  const data={app:'Mix',count:allArticles.length+allDocs.length,exportedAt:new Date().toISOString(),
    notes:allArticles,outlineDocs:allDocs,
    tombstones:nState.tombs,tombsOutline:oTombs,
    panes:nState.panes,layout:nState.layout};
  await doBackup('Mix',data,'Mix 数据备份 '+stampStr());
};
$('#impBtn').onclick=()=>{
  pickFile('.md,.markdown,.json,.txt',async file=>{
    try{
      const data=readBackup(await file.text());
      if(!data){toast('文件格式不正确','err');return;}
      const notes=Array.isArray(data.notes)?data.notes:[];
      const ods=Array.isArray(data.outlineDocs)?data.outlineDocs:[];
      if(!notes.length&&!ods.length){toast('文件中没有数据','err');return;}
      if(!confirm('⚠️ 数据更新\n\n即将用备份中的 '+notes.length+' 篇文章 + '+ods.length+' 篇大纲替换当前全部数据。\n当前内容会被覆盖且无法撤销。\n\n确定继续吗？'))return;
      if(notes.length){
        nState.notes=notes.map(n=>({
          id:n.id||uid(),
          title:String(n.title||''),
          folder:cleanLegacyFolder({folder:n.folder}),
          content:String(n.content||''),
          updated:Number(n.updated||Date.now())
        }));
        nState.tombs=data.tombstones&&typeof data.tombstones==='object'?data.tombstones:{};
        if(data.panes&&Array.isArray(data.panes)&&data.panes.length===2){
          nState.panes=data.panes.map(p=>({
            noteId:p.noteId||nState.notes[0].id,
            mode:(p.mode==='read'||p.mode==='outline')?p.mode:'edit'
          }));
          nState.layout=data.layout==='dual'?'dual':'single';
        }else{
          nState.panes[0].noteId=nState.notes[0].id;
          nState.panes[1].noteId=(nState.notes[1]||nState.notes[0]).id;
          nState.layout='single';
        }
        nState.panes.forEach(p=>{
          if(!nState.notes.some(n=>n.id===p.noteId))p.noteId=nState.notes[0].id;
        });
        nSave(true);
      }
      if(ods.length||Array.isArray(data.outlineDocs)){
        oDocs={};
        ods.forEach(d=>{
          const r=oNorm(d.root||mkNode('',[]));
          oDocs[d.id]={
            id:d.id,
            title:String(d.title||'未命名'),
            root:r,
            updated:Number(d.updated||Date.now()),
            created:Number(d.created||d.updated||Date.now())
          };
        });
        oTombs=data.tombsOutline&&typeof data.tombsOutline==='object'?data.tombsOutline:{};
        oCurId=Object.keys(oDocs)[0]||null;
        if(oCurId)openDoc(oCurId);
        else{
          oRoot=null;
          $('#oTitle').value='';
          $('#oTitle').disabled=true;
          oRender();
        }
        oSave(true);
      }
      $$('#nLay button').forEach(x=>x.classList.toggle('on',x.dataset.lay===nState.layout));
      $('#nPanes').dataset.lay=nState.layout;
      renderPanes();renderSidebar();
      toast('✓ 已恢复数据','ok');
      syncAll();
    }catch(e){toast('读取失败：'+e.message,'err');}
  });
};

/* 云同步 */
const nSyncDebounced=debounce(()=>nSync(),2000);
const oSyncDebounced=debounce(()=>oSync(),2000);
async function nSync(){
  if(!Cloud.has()){cldSet('未配置 · 仅本地','');return;}
  cldSet('同步中…','sync');
  const items=nState.notes.map(n=>({id:n.id,title:n.title||'',folder:n.folder||'',content:n.content||'',updated:Number(n.updated||0)||Date.now()}));
  const r=await Cloud.sync(COL_NOTE,items,nState.tombs);
  if(!r){cldSet('同步失败','err');return;}
  nState.tombs=r.tombs;
  nState.notes=r.items.map(i=>({
    id:i.id,
    title:String(i.title||''),
    folder:cleanLegacyFolder({folder:i.folder}),
    content:String(i.content||''),
    updated:Number(i.updated||0)
  }));
  nState.panes.forEach(p=>{
    if(!nState.notes.some(n=>n.id===p.noteId))p.noteId=nState.notes[0]?nState.notes[0].id:null;
  });
  nSave(true);renderPanes();renderSidebar();
  cldSet('已同步 · '+cldTime()+' · '+nState.notes.length+' 篇','ok');
}
async function oSync(){
  if(!Cloud.has())return;
  const items=Object.keys(oDocs).map(id=>({id,title:oDocs[id].title||'',root:oDocs[id].root,updated:Number(oDocs[id].updated||0)||Date.now(),created:Number(oDocs[id].created||0)||0}));
  const r=await Cloud.sync(COL_OUTLINE,items,oTombs);
  if(!r)return;
  oTombs=r.tombs;
  oDocs={};
  r.items.forEach(i=>{
    const nr=oNorm(i.root||mkNode('',[]));
    oDocs[i.id]={
      id:i.id,
      title:String(i.title||'未命名'),
      root:nr,
      updated:Number(i.updated||Date.now()),
      created:Number(i.created||i.updated||0)||0
    };
  });
  oCurId=(oCurId&&oDocs[oCurId])?oCurId:(Object.keys(oDocs)[0]||null);
  oSaveSilent();
  if(oCurId&&curMod==='outline')openDoc(oCurId);
  else if(!oCurId){
    oRoot=null;
    $('#oTitle').value='';
    $('#oTitle').disabled=true;
    if(curMod==='outline')oRender();
  }
  renderSidebar();
}

/* 启动 */
(function boot(){
  try{setTheme(localStorage.getItem('mc-theme')||'dark');}catch(e){setTheme('dark');}
  Cloud.cfg=Cloud.load();

  nLoad();oLoad();

  if(!nState.panes[0].noteId&&nState.notes.length)nState.panes[0].noteId=nState.notes[0].id;
  if(!nState.panes[1].noteId)nState.panes[1].noteId=nState.panes[0].noteId;
  $('#nPanes').dataset.lay=nState.layout;
  $$('#nLay button').forEach(x=>x.classList.toggle('on',x.dataset.lay===nState.layout));
  renderPanes();

  // 大纲初始化
  if(oCurId&&oDocs[oCurId]){
    openDoc(oCurId);
    $('#oTitle').disabled=false;
  }else{
    oCurId=null;
    oRoot=null;
    $('#oTitle').value='';
    $('#oTitle').disabled=true;
    oRender();
  }

  const start='data';
  document.body.dataset.mod=start;
  curMod=start;
  $$('.mod').forEach(x=>x.classList.toggle('on',x.id==='mod-'+start));
  $$('.side-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===start));
  $('#topModName').textContent='Data';
  $('#barNote').style.display='none';
  $('#barOutline').style.display='none';
  $('#sideNewBtn').textContent='＋ 新建文章';
  renderSidebar();

  if(Cloud.has()){
    Cloud.init().then(ok=>{
      if(ok)setTimeout(()=>syncAll(),300);
      else cldSet('连接失败','err');
    });
  }else cldSet('未配置 · 仅本地','');

  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&Cloud.has()&&Cloud.ready)syncAll();
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if($('#modal').classList.contains('on'))$('#modal').classList.remove('on');
      else{const s=$('#sidebar');s.classList.remove('open');$('#scrim').classList.remove('on');}
    }
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){
      e.preventDefault();
      const inp=e.target;
      if(inp&&inp.tagName==='INPUT')inp.blur();
      toast('已保存','ok');
    }
  });
})();

})();
</script>
