<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr.Chang</title>
<style>
  * {
	margin: 0; padding: 0; box-sizing: border-box;
	letter-spacing: 1px;
  }

  .sp-cjk { letter-spacing: 2px; }

  :root {
	--bg: #131315;
	--panel: #1b1b1e;
	--panel-2: #232327;
	--border: #2b2b31;
	--text: #dcddde;
	--muted: #85858c;
	--accent: #a88bfa;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
	background: var(--bg);
	color: var(--text);
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
	font-size: 13px;
	-webkit-font-smoothing: antialiased;
  }

  .app { display: flex; height: 100vh; width: 100vw; }

  /* ================= 主区域 ================= */
  .main { flex: 1; position: relative; overflow: hidden; min-width: 0; }

  #grid {
	position: absolute; inset: 0;
	width: 100%; height: 100%;
	display: block; cursor: crosshair; touch-action: none;
  }

  .vignette {
	position: absolute; inset: 0;
	pointer-events: none;
	background:
	  radial-gradient(ellipse 72% 68% at 50% 50%,
		rgba(19,19,21,0) 0%,
		rgba(19,19,21,0.5) 52%,
		rgba(19,19,21,0.88) 100%);
  }

  /* ---- 顶部悬浮条 ---- */
  .overlay { position: absolute; pointer-events: none; z-index: 5; }
  .overlay > * { pointer-events: auto; }

  .topbar {
	top: 14px; left: 14px; right: 14px;
	display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }

  .pill {
	background: rgba(27,27,30,.82);
	backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
	border: 1px solid var(--border); border-radius: 9px;
	padding: 7px 13px; font-size: 12px; color: var(--muted);
	font-variant-numeric: tabular-nums;
	display: flex; align-items: center; gap: 8px;
	white-space: nowrap;
	box-shadow: 0 4px 20px rgba(0,0,0,.4);
  }

  .coord-dot {
	width: 9px; height: 9px; border-radius: 50%;
	flex-shrink: 0; box-shadow: 0 0 8px currentColor;
  }

  .zoom-ctrl {
	display: flex; align-items: center; gap: 2px;
	background: rgba(27,27,30,.82);
	backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
	border: 1px solid var(--border); border-radius: 9px;
	padding: 3px;
	box-shadow: 0 4px 20px rgba(0,0,0,.4);
  }

  .zoom-ctrl button {
	width: 27px; height: 27px; border: none; border-radius: 6px;
	background: transparent; color: var(--text);
	font-size: 15px; cursor: pointer; font-family: inherit;
	display: grid; place-items: center;
	transition: background .13s; line-height: 1;
  }
  .zoom-ctrl button:hover { background: #2c2c34; }
  .zoom-ctrl button:active { background: #35353f; }

  #zoomLabel {
	min-width: 56px; text-align: center; font-size: 11.5px;
	color: var(--muted); font-variant-numeric: tabular-nums; padding: 0 4px;
  }

  /* ================= 中央导航 ================= */
  .hero {
	position: absolute; inset: 0;
	display: flex; flex-direction: column;
	align-items: center; justify-content: center;
	gap: 24px;
	padding: 72px 40px 40px;
	pointer-events: none;
	z-index: 4;
	overflow-y: auto;
	overflow-x: hidden;
  }

  .hero::-webkit-scrollbar { width: 6px; }
  .hero::-webkit-scrollbar-thumb { background: #333338; border-radius: 3px; }
  .hero::-webkit-scrollbar-track { background: transparent; }

  .hero-head { text-align: center; }

  .hero-title {
	display: inline-block;
	font-size: 30px;
	font-weight: 600;
	color: #f0f0f4;
	text-decoration: none;
	cursor: pointer;
	pointer-events: auto;
	text-shadow: 0 0 42px rgba(168,139,250,.35);
  }

  .hero-title .dot { color: var(--accent); }

  .hero-sub {
	margin-top: 10px;
	font-size: 16px;
	color: var(--muted);
  }

  .cards {
	pointer-events: auto;
	display: grid;
	grid-template-columns: repeat(2, minmax(0, 1fr));
	gap: 14px;
	width: 100%;
	max-width: 720px;
  }

  /* ---- 卡片 ---- */
  .card {
	position: relative;
	display: block;
	border-radius: 14px;
	text-decoration: none;
	color: var(--text);
	background: rgba(20, 20, 23, .82);
	border: 1px solid var(--border);
	box-shadow: 0 6px 26px rgba(0,0,0,.4);
	overflow: hidden;
	transition: transform .22s cubic-bezier(.4,0,.2,1),
				border-color .22s,
				box-shadow .22s,
				background .22s;
	isolation: isolate;
  }

  .card-grid {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	pointer-events: none;
	z-index: 0;
	display: block;
  }

  .card::before {
	content: "";
	position: absolute;
	inset: 0;
	border-radius: inherit;
	background: radial-gradient(120% 110% at 0% 0%,
	  color-mix(in srgb, var(--c) 16%, transparent) 0%,
	  transparent 60%);
	opacity: 0;
	transition: opacity .28s;
	pointer-events: none;
	z-index: 1;
  }

  .card:hover {
	transform: translateY(-4px);
	background: rgba(26, 26, 31, .85);
	border-color: color-mix(in srgb, var(--c) 52%, var(--border));
	box-shadow: 0 14px 38px rgba(0,0,0,.5),
				0 0 0 1px color-mix(in srgb, var(--c) 22%, transparent),
				0 0 40px color-mix(in srgb, var(--c) 26%, transparent);
  }

  .card:hover::before { opacity: 1; }

  .card:active { transform: translateY(-1px) scale(.99); }

  .card-inner {
	position: relative;
	z-index: 2;
	display: flex;
	align-items: center;
	gap: 14px;
	padding: 17px 18px;
  }

  .card-icon {
	width: 42px; height: 42px;
	flex-shrink: 0;
	border-radius: 50%;
	display: grid; place-items: center;
	font-size: 17px;
	background: color-mix(in srgb, var(--c) 16%, rgba(20,20,23,.6));
	color: var(--c);
	border: 1px solid color-mix(in srgb, var(--c) 28%, transparent);
	transition: transform .2s, box-shadow .2s;
  }

  .card:hover .card-icon {
	transform: scale(1.07) rotate(-3deg);
	box-shadow: 0 0 22px color-mix(in srgb, var(--c) 45%, transparent);
  }

  .card-body { flex: 1; min-width: 0; }

  .card-title {
	font-size: 14.5px;
	font-weight: 600;
	color: #ececf0;
  }

  .card-desc {
	margin-top: 3px;
	font-size: 11.5px;
	color: var(--muted);
	line-height: 1.45;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
  }

  .card-arrow {
	flex-shrink: 0;
	font-size: 15px;
	color: #55555e;
	transition: transform .2s, color .2s;
  }

  .card:hover .card-arrow {
	transform: translateX(4px);
	color: var(--c);
  }

  /* ---- 底部提示 ---- */
  .hint {
	bottom: 16px; left: 50%; transform: translateX(-50%);
	font-size: 11.5px; color: #6e6e78;
	background: rgba(27,27,30,.82);
	backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
	border: 1px solid var(--border); border-radius: 999px;
	padding: 7px 16px; white-space: nowrap;
	pointer-events: none;
	box-shadow: 0 4px 20px rgba(0,0,0,.4);
  }
  .hint b { color: #9a9aa4; font-weight: 500; }

  /* ================= Memo 预览 ================= */
  .memo-preview {
	pointer-events: auto;
	width: 100%;
	max-width: 720px;
	display: flex;
	flex-direction: column;
	gap: 2px;
	margin-bottom: -6px;

	padding: 7px;
	border-radius: 14px;
	background: rgba(20, 20, 23, .42);
	border: 1px solid var(--border);
	box-shadow: 0 6px 26px rgba(0,0,0,.28);
  }

  .memo-preview .mp-item {
	display: flex;
	align-items: flex-start;
	gap: 10px;
	font-size: 13px;
	line-height: 1.6;
	color: var(--text);
	text-decoration: none;
	cursor: pointer;

	padding: 8px 10px;
	border-radius: 8px;
	border: 1px solid transparent;

	transition: background .18s, border-color .18s, color .18s;
  }

  .memo-preview .mp-item:hover {
	background: rgba(168, 139, 250, .10);
	border-color: color-mix(in srgb, var(--accent) 28%, transparent);
	color: #ffffff;
  }

  .memo-preview .mp-item:active {
	background: rgba(168, 139, 250, .16);
  }

  .memo-preview .mp-item::before {
	content: "";
	flex-shrink: 0;
	width: 6px;
	height: 6px;
	border-radius: 50%;
	background: var(--accent);
	box-shadow: 0 0 8px rgba(168, 139, 250, .75);
	margin-top: 7px;
	transition: box-shadow .18s, transform .18s;
  }

  .memo-preview .mp-item:hover::before {
	box-shadow: 0 0 14px rgba(168, 139, 250, 1);
	transform: scale(1.15);
  }

  .memo-preview .mp-body {
	flex: 1;
	min-width: 0;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
  }

  .memo-preview .mp-empty {
	display: flex;
	align-items: flex-start;
	gap: 10px;
	font-size: 13px;
	line-height: 1.6;
	color: var(--muted);
	padding: 8px 10px;
  }
  .memo-preview .mp-empty::before {
	content: "";
	flex-shrink: 0;
	width: 6px;
	height: 6px;
	border-radius: 50%;
	background: #3a3a42;
	margin-top: 7px;
  }
  .memo-preview .mp-empty a {
	color: var(--accent);
	text-decoration: none;
  }
  .memo-preview .mp-empty a:hover { text-decoration: underline; }

  /* ================= 响应式 ================= */
  @media (max-width: 900px) {
	.hero-title { font-size: 25px; }
  }

  @media (max-width: 780px) {
	.cards { grid-template-columns: 1fr; max-width: 420px; }
	.hero { padding: 68px 20px 56px; gap: 20px; }
	.hero-title { font-size: 22px; }
	.hint { font-size: 10.5px; padding: 6px 12px; }
	.memo-preview { max-width: 460px; padding: 6px; }
	.memo-preview .mp-item,
	.memo-preview .mp-empty { font-size: 12.5px; padding: 8px 9px; }
  }

  @media (max-height: 680px) {
	.hero { gap: 18px; padding-top: 62px; }
	.hero-title { font-size: 24px; }
	.hero-sub { margin-top: 6px; }
  }

  /* ================= 手机端自适应 ================= */
  @media (max-width: 780px) {
	.app { height: 100dvh; }
	html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
	a, button, canvas { -webkit-tap-highlight-color: transparent; }

	.hero {
	  pointer-events: auto;
	  touch-action: pan-y;
	  justify-content: flex-start;
	  gap: 18px;
	  padding: 62px 16px 48px;
	  padding-top: max(62px, calc(env(safe-area-inset-top) + 54px));
	  padding-bottom: calc(48px + env(safe-area-inset-bottom));
	  -webkit-overflow-scrolling: touch;
	  overscroll-behavior: contain;
	}

	.hero-head { margin-top: auto; }
	.cards { margin-bottom: auto; }

	.hero-title { font-size: 24px; }
	.hero-sub { margin-top: 8px; font-size: 14px; }

	.cards { grid-template-columns: 1fr; gap: 10px; max-width: 460px; }
	.card-inner { padding: 14px; gap: 12px; }
	.card-icon { width: 38px; height: 38px; font-size: 15px; }
	.card-title { font-size: 14px; }
	.card-desc { font-size: 11px; }
	.card-arrow { font-size: 14px; }

	.topbar {
	  top: max(10px, env(safe-area-inset-top));
	  left: 10px;
	  right: 10px;
	  gap: 8px;
	}

	.pill {
	  padding: 6px 10px;
	  font-size: 11px;
	  min-width: 0;
	  overflow: hidden;
	}

	.zoom-ctrl { padding: 2px; border-radius: 8px; }
	.zoom-ctrl button { width: 32px; height: 32px; font-size: 16px; }
	#zoomLabel { min-width: 50px; font-size: 11px; }

	.hint {
	  bottom: calc(12px + env(safe-area-inset-bottom));
	  font-size: 10.5px;
	  padding: 6px 12px;
	}

	.memo-preview .mp-item,
	.memo-preview .mp-empty { padding: 10px 11px; }
  }

  /* 触摸设备：禁用悬停态残留 */
  @media (hover: none) {
	.card:hover {
	  transform: none;
	  background: rgba(20, 20, 23, .82);
	  border-color: var(--border);
	  box-shadow: 0 6px 26px rgba(0,0,0,.4);
	}
	.card:hover::before { opacity: 0; }
	.card:hover .card-icon { transform: none; box-shadow: none; }
	.card:hover .card-arrow { transform: none; color: #55555e; }

	.memo-preview .mp-item:hover {
	  background: transparent;
	  border-color: transparent;
	  color: var(--text);
	}
	.memo-preview .mp-item:hover::before {
	  transform: none;
	  box-shadow: 0 0 8px rgba(168, 139, 250, .75);
	}
	.memo-preview .mp-item:active {
	  background: rgba(168, 139, 250, .16);
	  border-color: color-mix(in srgb, var(--accent) 34%, transparent);
	}
  }

  @media (orientation: landscape) and (max-height: 520px) {
	.hero {
	  justify-content: flex-start;
	  gap: 14px;
	  padding-top: 56px;
	}
	.hero-head { margin-top: 0; }
	.cards { margin-bottom: 0; }
	.hero-title { font-size: 20px; }
	.hero-sub { font-size: 13px; margin-top: 4px; }
	.cards {
	  grid-template-columns: repeat(2, minmax(0, 1fr));
	  gap: 10px;
	  max-width: 620px;
	}
	.card-inner { padding: 12px 13px; gap: 11px; }
	.card-icon { width: 34px; height: 34px; font-size: 14px; }
	.card-desc { font-size: 10.5px; }
	.memo-preview { max-width: 620px; }
  }

  @media (max-width: 380px) {
	.hero { padding-left: 12px; padding-right: 12px; }
	.hero-title { font-size: 21px; }
	.hero-sub { font-size: 13px; }
	.card-inner { padding: 12px; gap: 10px; }
	.card-icon { width: 34px; height: 34px; font-size: 14px; }
	.card-title { font-size: 13.5px; }
	.card-desc { font-size: 10.5px; }
	.zoom-ctrl button { width: 30px; height: 30px; }
	#zoomLabel { min-width: 44px; }
	.pill { font-size: 10.5px; padding: 5px 9px; }
	.memo-preview { padding: 5px; }
	.memo-preview .mp-item,
	.memo-preview .mp-empty { font-size: 12px; padding: 8px 9px; }
  }
</style>
</head>
<body>

<div class="app">
  <main class="main">
	<canvas id="grid"></canvas>
	<div class="vignette"></div>

	<div class="overlay topbar">
	  <div class="pill" id="coords"></div>
	  <div class="zoom-ctrl">
		<button id="zoomOut" title="缩小">−</button>
		<span id="zoomLabel">1.00×</span>
		<button id="zoomIn" title="放大">+</button>
	  </div>
	</div>

	<div class="hero">
	  <div class="hero-head">
		<a class="hero-title" href="index.html">Mr.Chang<span class="dot">.</span></a>
		<div class="hero-sub" id="heroSub"></div>
	  </div>

	  <div class="memo-preview" id="memoPreview"></div>

	  <div class="cards">
		<!-- 1. Memo -->
		<a class="card" href="memo.html" style="--c:#a88bfa" data-color="#a88bfa">
		  <canvas class="card-grid"></canvas>
		  <div class="card-inner">
			<div class="card-icon">◉</div>
			<div class="card-body">
			  <div class="card-title">Memo</div>
			  <div class="card-desc">随时记录、云端同步</div>
			</div>
			<div class="card-arrow">→</div>
		  </div>
		</a>

		<!-- 2. Mix -->
		<a class="card" href="mix.html" style="--c:#56d4dd" data-color="#56d4dd">
		  <canvas class="card-grid"></canvas>
		  <div class="card-inner">
			<div class="card-icon">▦</div>
			<div class="card-body">
			  <div class="card-title">Mix</div>
			  <div class="card-desc">文章大纲、一站式编辑</div>
			</div>
			<div class="card-arrow">→</div>
		  </div>
		</a>

		<!-- 3. Web -->
		<a class="card" href="web.html" style="--c:#7ee787" data-color="#7ee787">
		  <canvas class="card-grid"></canvas>
		  <div class="card-inner">
			<div class="card-icon">✎</div>
			<div class="card-body">
			  <div class="card-title">Web</div>
			  <div class="card-desc">私人定制、数据联通</div>
			</div>
			<div class="card-arrow">→</div>
		  </div>
		</a>
	  </div>
	</div>

	<div class="overlay hint">
	   <b></b>
	</div>
  </main>
</div>

<script>
(() => {
  'use strict';

  /* ============================================================
	 零、中文/英文差异化字间距
	 ============================================================ */
  const CJK_RE = /[\u2e80-\u9fff\u3000-\u303f\uff00-\uffef]/;

  function wrapText(root) {
	if (!root) return;
	const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
	  acceptNode(node) {
		const p = node.parentNode;
		if (!p) return NodeFilter.FILTER_REJECT;
		const tag = p.tagName;
		if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'NOSCRIPT') {
		  return NodeFilter.FILTER_REJECT;
		}
		if (p.classList &&
			(p.classList.contains('sp-cjk') || p.classList.contains('sp-latin'))) {
		  return NodeFilter.FILTER_REJECT;
		}
		return NodeFilter.FILTER_ACCEPT;
	  }
	});

	const nodes = [];
	while (walker.nextNode()) nodes.push(walker.currentNode);

	for (const node of nodes) {
	  const text = node.textContent;
	  if (!text) continue;
	  if (!CJK_RE.test(text)) continue;

	  const frag = document.createDocumentFragment();
	  let buffer = '';
	  let bufferType = null;

	  const flush = () => {
		if (!buffer) return;
		const span = document.createElement('span');
		span.className = bufferType === 'cjk' ? 'sp-cjk' : 'sp-latin';
		span.textContent = buffer;
		frag.appendChild(span);
		buffer = '';
	  };

	  for (const ch of text) {
		const type = CJK_RE.test(ch) ? 'cjk' : 'latin';
		if (bufferType === type) {
		  buffer += ch;
		} else {
		  flush();
		  bufferType = type;
		  buffer = ch;
		}
	  }
	  flush();

	  node.parentNode.replaceChild(frag, node);
	}
  }

  const idle = (fn, timeout) => {
	if (typeof window.requestIdleCallback === 'function') {
	  window.requestIdleCallback(fn, { timeout: timeout || 800 });
	} else {
	  setTimeout(fn, 1);
	}
  };

  /* ============================================================
	 零点五、日期 / 星期
	 ============================================================ */
  (function setDateLine() {
	const el = document.getElementById('heroSub');
	if (!el) return;

	const now = new Date();
	const y = now.getFullYear();
	const m = now.getMonth() + 1;
	const d = now.getDate();
	const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
	const wd = weekdays[now.getDay()];

	el.textContent = `${y}年${m}月${d}日 ${wd}`;
  })();

  /* ============================================================
	 一、卡片微型网格特效
	 ============================================================ */
  function hexToRgb(hex) {
	const n = parseInt(hex.replace('#', ''), 16);
	return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  class CardGrid {
	constructor(card, canvas, rgb) {
	  this.card = card;
	  this.canvas = canvas;
	  this.ctx = canvas.getContext('2d');
	  this.rgb = rgb;

	  this.cell = 7;
	  this.t = Math.random() * 20;
	  this.act = 0.35;
	  this.hover = false;
	  this.mx = -9999;
	  this.my = -9999;

	  this._w = 0; this._h = 0;
	  this.cols = 0; this.rows = 0;

	  const [r, g, b] = rgb;
	  this.palette = [];
	  for (let i = 0; i <= 32; i++) {
		const a = (i / 32) * 0.9;
		this.palette.push(`rgba(${r},${g},${b},${a.toFixed(3)})`);
	  }

	  this.resize();
	}

	resize() {
	  const rect = this.card.getBoundingClientRect();
	  const cw = Math.round(rect.width);
	  const ch = Math.round(rect.height);
	  if (cw < 8 || ch < 8) return;
	  if (cw === this._w && ch === this._h) return;

	  this._w = cw;
	  this._h = ch;

	  const dpr = Math.min(window.devicePixelRatio || 1, 2);
	  this.canvas.width = Math.round(cw * dpr);
	  this.canvas.height = Math.round(ch * dpr);
	  this.canvas.style.width = cw + 'px';
	  this.canvas.style.height = ch + 'px';
	  this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

	  this.cols = Math.ceil(cw / this.cell);
	  this.rows = Math.ceil(ch / this.cell);

	  const n = this.cols * this.rows;
	  this.base  = new Float32Array(n);
	  this.phase = new Float32Array(n);
	  this.speed = new Float32Array(n);
	  this.pulse = new Float32Array(n);

	  for (let i = 0; i < n; i++) {
		this.phase[i] = Math.random() * Math.PI * 2;
		this.speed[i] = 0.5 + Math.random() * 1.5;
		this.base[i]  = 0.015 + Math.random() * 0.055;
	  }
	}

	update(dt) {
	  if (!this.cols) return;

	  this.t += dt;

	  const target = this.hover ? 1 : 0.32;
	  this.act += (target - this.act) * Math.min(1, dt * 7);

	  const { cols, rows, pulse } = this;

	  const decay = Math.pow(0.15, dt);
	  for (let i = 0; i < pulse.length; i++) {
		if (pulse[i] > 0.003) pulse[i] *= decay;
		else if (pulse[i] !== 0) pulse[i] = 0;
	  }

	  if (this.hover) {
		const cx = Math.floor(this.mx / this.cell);
		const cy = Math.floor(this.my / this.cell);
		const R = 6;
		for (let dy = -R; dy <= R; dy++) {
		  const y = cy + dy;
		  if (y < 0 || y >= rows) continue;
		  for (let dx = -R; dx <= R; dx++) {
			const x = cx + dx;
			if (x < 0 || x >= cols) continue;
			const d2 = dx * dx + dy * dy;
			const v = Math.exp(-d2 / 7.5) * 0.95;
			const i = y * cols + x;
			if (v > pulse[i]) pulse[i] = v;
		  }
		}

		if (Math.random() < dt * 14) {
		  const a = Math.random() * Math.PI * 2;
		  const r = 2 + Math.random() * 5;
		  const x = Math.round(cx + Math.cos(a) * r);
		  const y = Math.round(cy + Math.sin(a) * r);
		  if (x >= 0 && y >= 0 && x < cols && y < rows) {
			pulse[y * cols + x] = Math.max(pulse[y * cols + x], 0.5 + Math.random() * 0.5);
		  }
		}
	  } else {
		if (Math.random() < dt * 2.2) {
		  const n = 1 + ((Math.random() * 3) | 0);
		  for (let k = 0; k < n; k++) {
			const i = (Math.random() * pulse.length) | 0;
			const v = 0.22 + Math.random() * 0.38;
			if (v > pulse[i]) pulse[i] = v;
		  }
		}
	  }
	}

	draw() {
	  if (!this.cols) return;

	  const { ctx, cols, rows, cell, base, phase, speed, pulse, palette } = this;
	  ctx.clearRect(0, 0, this._w, this._h);

	  const t = this.t;
	  const s = cell;
	  const inner = s - 1.6;
	  const radius = inner / 2;
	  const boost = 0.45 + this.act * 1.05;

	  for (let y = 0; y < rows; y++) {
		const rowBase = y * cols;
		const cy = y * s + s / 2;
		for (let x = 0; x < cols; x++) {
		  const i = rowBase + x;

		  const breathe = (base[i] + Math.sin(t * speed[i] + phase[i]) * 0.035) * boost;
		  let v = breathe + pulse[i] * 1.1;
		  if (v <= 0.012) continue;
		  if (v > 1) v = 1;

		  ctx.beginPath();
		  ctx.arc(x * s + s / 2, cy, radius, 0, Math.PI * 2);
		  ctx.fillStyle = palette[(v * 32) | 0];
		  ctx.fill();
		}
	  }
	}
  }

  /* ============================================================
	 二、背景百万格子画布
	 ============================================================ */
  const GRID  = 1000;
  const COLORS = [
	'#a88bfa', '#7ee787', '#79c0ff', '#ffa657',
	'#ff7b72', '#d2a8ff', '#f2cc60', '#56d4dd'
  ];
  const MIN_SCALE = 0.12;
  const MAX_SCALE = 320;
  const DEFAULT_SCALE = 2;
  const CELL = 3;

  const canvas = document.getElementById('grid');
  const ctx = canvas.getContext('2d', { alpha: false });

  const off = document.createElement('canvas');
  off.width  = GRID * CELL;
  off.height = GRID * CELL;
  const octx = off.getContext('2d');

  let scale = 1, offsetX = 0, offsetY = 0;
  const claimed = new Map();

  let hoverCell = null;
  let pointerDown = false, moved = false;
  let downX = 0, downY = 0, prevX = 0, prevY = 0;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  let cachedGrad = null;
  let cachedGradW = 0, cachedGradH = 0;

  function resizeCanvas() {
	dpr = Math.min(window.devicePixelRatio || 1, 2);
	const w = canvas.clientWidth, h = canvas.clientHeight;
	const nw = Math.max(1, Math.round(w * dpr));
	const nh = Math.max(1, Math.round(h * dpr));
	if (canvas.width !== nw || canvas.height !== nh) {
	  canvas.width = nw; canvas.height = nh;
	}
  }

  function clampOffset() {
	const w = canvas.clientWidth, h = canvas.clientHeight;
	const gw = GRID * scale, gh = GRID * scale;
	const m = 90;
	if (gw <= w) offsetX = (w - gw) / 2;
	else offsetX = Math.min(m, Math.max(w - gw - m, offsetX));
	if (gh <= h) offsetY = (h - gh) / 2;
	else offsetY = Math.min(m, Math.max(h - gh - m, offsetY));
  }

  function fitView() {
	const w = canvas.clientWidth, h = canvas.clientHeight;
	const pad = 96;
	scale = Math.max(MIN_SCALE, Math.min((w - pad) / GRID, (h - pad) / GRID));
	offsetX = (w - GRID * scale) / 2;
	offsetY = (h - GRID * scale) / 2;
	refresh();
  }

  function defaultView() {
	const w = canvas.clientWidth, h = canvas.clientHeight;
	if (!w || !h) { fitView(); return; }

	scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, DEFAULT_SCALE));

	let fx = 500, fy = 500;
	if (claimed.size > 0) {
	  let sx = 0, sy = 0, n = 0;
	  for (const k of claimed.keys()) {
		const c = k.indexOf(',');
		sx += +k.slice(0, c);
		sy += +k.slice(c + 1);
		n++;
	  }
	  fx = sx / n; fy = sy / n;
	}

	offsetX = w / 2 - fx * scale;
	offsetY = h / 2 - fy * scale;
	clampOffset();
	refresh();
  }

  function draw() {
	resizeCanvas();
	const w = canvas.clientWidth, h = canvas.clientHeight;
	if (!w || !h) return;

	ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

	ctx.fillStyle = '#131315';
	ctx.fillRect(0, 0, w, h);

	if (!cachedGrad || cachedGradW !== w || cachedGradH !== h) {
	  cachedGrad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.7);
	  cachedGrad.addColorStop(0, 'rgba(168,139,250,0.06)');
	  cachedGrad.addColorStop(0.55, 'rgba(109,92,224,0.022)');
	  cachedGrad.addColorStop(1, 'rgba(0,0,0,0)');
	  cachedGradW = w; cachedGradH = h;
	}
	ctx.fillStyle = cachedGrad;
	ctx.fillRect(0, 0, w, h);

	const x0 = Math.max(0, Math.floor(-offsetX / scale));
	const y0 = Math.max(0, Math.floor(-offsetY / scale));
	const x1 = Math.min(GRID, Math.ceil((w - offsetX) / scale));
	const y1 = Math.min(GRID, Math.ceil((h - offsetY) / scale));

	if (x1 <= x0 || y1 <= y0) {
	  ctx.strokeStyle = 'rgba(168,139,250,0.2)';
	  ctx.strokeRect(offsetX + 0.5, offsetY + 0.5, GRID * scale - 1, GRID * scale - 1);
	  return;
	}

	const px = offsetX + x0 * scale;
	const py = offsetY + y0 * scale;
	const pw = (x1 - x0) * scale;
	const ph = (y1 - y0) * scale;

	ctx.imageSmoothingEnabled = true;
	ctx.drawImage(
	  off,
	  x0 * CELL, y0 * CELL,
	  (x1 - x0) * CELL, (y1 - y0) * CELL,
	  px, py, pw, ph
	);

	if (scale >= 6) {
	  ctx.beginPath();
	  for (let x = x0; x <= x1; x++) {
		const lx = Math.round(offsetX + x * scale) + 0.5;
		ctx.moveTo(lx, py); ctx.lineTo(lx, py + ph);
	  }
	  for (let y = y0; y <= y1; y++) {
		const ly = Math.round(offsetY + y * scale) + 0.5;
		ctx.moveTo(px, ly); ctx.lineTo(px + pw, ly);
	  }
	  ctx.lineWidth = 1;
	  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
	  ctx.stroke();
	} else if (scale >= 2.5) {
	  const step = Math.max(5, Math.round(6 / scale) * 5);
	  ctx.beginPath();
	  for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) {
		const lx = Math.round(offsetX + x * scale) + 0.5;
		ctx.moveTo(lx, py); ctx.lineTo(lx, py + ph);
	  }
	  for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) {
		const ly = Math.round(offsetY + y * scale) + 0.5;
		ctx.moveTo(px, ly); ctx.lineTo(px + pw, ly);
	  }
	  ctx.lineWidth = 1;
	  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
	  ctx.stroke();
	}

	ctx.strokeStyle = 'rgba(168,139,250,0.32)';
	ctx.lineWidth = 1;
	ctx.strokeRect(offsetX + 0.5, offsetY + 0.5, GRID * scale - 1, GRID * scale - 1);

	if (hoverCell) {
	  const cx = offsetX + (hoverCell.x + 0.5) * scale;
	  const cy = offsetY + (hoverCell.y + 0.5) * scale;

	  if (scale >= 5) {
		const r = Math.max(1.5, scale / 2 - 1);
		ctx.beginPath();
		ctx.arc(cx, cy, r, 0, Math.PI * 2);
		ctx.fillStyle = 'rgba(168,139,250,0.22)';
		ctx.fill();
		ctx.strokeStyle = 'rgba(190,168,255,1)';
		ctx.lineWidth = 1.5;
		ctx.stroke();
	  } else {
		const r = Math.max(2, scale * 0.5);
		ctx.beginPath();
		ctx.arc(cx, cy, r, 0, Math.PI * 2);
		ctx.fillStyle = 'rgba(190,168,255,0.95)';
		ctx.fill();

		ctx.beginPath();
		ctx.arc(cx, cy, r + 3.5, 0, Math.PI * 2);
		ctx.strokeStyle = 'rgba(190,168,255,0.5)';
		ctx.lineWidth = 1;
		ctx.stroke();
	  }
	}
  }

  function setCell(x, y, color) {
	claimed.set(x + ',' + y, color);
	const cx = x * CELL + CELL / 2;
	const cy = y * CELL + CELL / 2;
	octx.beginPath();
	octx.arc(cx, cy, CELL / 2 - 0.12, 0, Math.PI * 2);
	octx.fillStyle = color;
	octx.fill();
  }

  function clearCell(x, y) {
	octx.clearRect(x * CELL, y * CELL, CELL, CELL);
  }

  const elCoords = document.getElementById('coords');

  function updateCoords(cell) {
	if (!cell) {
	  elCoords.textContent = '';
	  return;
	}
	const k = cell.x + ',' + cell.y;
	const has = claimed.has(k);
	const idx = cell.y * GRID + cell.x;
	const color = has ? claimed.get(k) : '#3a3a42';

	elCoords.innerHTML =
	  `<span class="coord-dot" style="background:${color};color:${color}"></span>` +
	  `#${idx.toLocaleString('en-US')} &nbsp;·&nbsp; x:${cell.x} y:${cell.y}` +
	  (has ? ' &nbsp;·&nbsp; <span style="color:#a88bfa">已点亮</span>' : '');
  }

  const elZoom = document.getElementById('zoomLabel');
  function updateZoomLabel() {
	elZoom.textContent = scale.toFixed(2) + '×';
  }

  function refresh() {
	draw();
	updateZoomLabel();
  }

  canvas.addEventListener('pointerdown', (e) => {
	if (e.button !== 0) return;
	pointerDown = true; moved = false;
	downX = prevX = e.clientX;
	downY = prevY = e.clientY;
	canvas.setPointerCapture(e.pointerId);
	canvas.style.cursor = 'grabbing';
  });

  canvas.addEventListener('pointermove', (e) => {
	const rect = canvas.getBoundingClientRect();
	const mx = e.clientX - rect.left;
	const my = e.clientY - rect.top;

	if (pointerDown) {
	  if (!moved && (Math.abs(e.clientX - downX) > 3 || Math.abs(e.clientY - downY) > 3)) {
		moved = true;
	  }
	  if (moved) {
		offsetX += e.clientX - prevX;
		offsetY += e.clientY - prevY;
		prevX = e.clientX; prevY = e.clientY;
		clampOffset();
	  }
	}

	const gx = Math.floor((mx - offsetX) / scale);
	const gy = Math.floor((my - offsetY) / scale);
	const inside = gx >= 0 && gy >= 0 && gx < GRID && gy < GRID;

	const changed =
	  (!inside && hoverCell !== null) ||
	  (inside && (!hoverCell || hoverCell.x !== gx || hoverCell.y !== gy));

	hoverCell = inside ? { x: gx, y: gy } : null;

	if (changed) updateCoords(hoverCell);
	if (changed || moved) draw();
  });

  canvas.addEventListener('pointerup', (e) => {
	if (!pointerDown) return;
	pointerDown = false;
	canvas.style.cursor = 'crosshair';

	if (!moved) {
	  const rect = canvas.getBoundingClientRect();
	  const mx = e.clientX - rect.left;
	  const my = e.clientY - rect.top;
	  const gx = Math.floor((mx - offsetX) / scale);
	  const gy = Math.floor((my - offsetY) / scale);

	  if (gx >= 0 && gy >= 0 && gx < GRID && gy < GRID) {
		const k = gx + ',' + gy;
		if (e.shiftKey || claimed.has(k)) {
		  claimed.delete(k);
		  clearCell(gx, gy);
		} else {
		  setCell(gx, gy, COLORS[(Math.random() * COLORS.length) | 0]);
		}
		updateCoords(hoverCell);
		refresh();
	  }
	}
  });

  canvas.addEventListener('pointercancel', () => {
	pointerDown = false;
	canvas.style.cursor = 'crosshair';
  });

  canvas.addEventListener('pointerleave', () => {
	if (pointerDown) return;
	hoverCell = null;
	updateCoords(null);
	draw();
  });

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  canvas.addEventListener('wheel', (e) => {
	e.preventDefault();

	const rect = canvas.getBoundingClientRect();
	const mx = e.clientX - rect.left;
	const my = e.clientY - rect.top;

	const factor = Math.exp(-e.deltaY * 0.0016);
	const next = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * factor));
	if (Math.abs(next - scale) < 1e-6) return;

	const gx = (mx - offsetX) / scale;
	const gy = (my - offsetY) / scale;

	scale = next;
	offsetX = mx - gx * scale;
	offsetY = my - gy * scale;
	clampOffset();

	const hx = Math.floor((mx - offsetX) / scale);
	const hy = Math.floor((my - offsetY) / scale);
	const inside = hx >= 0 && hy >= 0 && hx < GRID && hy < GRID;
	hoverCell = inside ? { x: hx, y: hy } : null;
	updateCoords(hoverCell);

	refresh();
  }, { passive: false });

  function zoomBy(factor) {
	const w = canvas.clientWidth, h = canvas.clientHeight;
	const cx = w / 2, cy = h / 2;
	const gx = (cx - offsetX) / scale;
	const gy = (cy - offsetY) / scale;

	scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * factor));
	offsetX = cx - gx * scale;
	offsetY = cy - gy * scale;
	clampOffset();
	refresh();
  }

  document.getElementById('zoomIn').addEventListener('click', () => zoomBy(1.45));
  document.getElementById('zoomOut').addEventListener('click', () => zoomBy(1 / 1.45));

  window.addEventListener('keydown', (e) => {
	if (e.target.tagName === 'INPUT') return;
	switch (e.key.toLowerCase()) {
	  case 'f': fitView(); break;
	  case '+': case '=': zoomBy(1.45); break;
	  case '-': case '_': zoomBy(1 / 1.45); break;
	}
  });

  const ro = new ResizeObserver(() => { draw(); });
  ro.observe(document.querySelector('.main'));

  /* ============================================================
	 三、初始化
	 ============================================================ */

  (function seed() {
	const seedCount = 1400;
	for (let i = 0; i < seedCount; i++) {
	  let x, y;
	  if (Math.random() < 0.65) {
		const r = Math.pow(Math.random(), 0.65) * 270;
		const a = Math.random() * Math.PI * 2;
		x = Math.round(500 + Math.cos(a) * r + (Math.random() - 0.5) * 60);
		y = Math.round(500 + Math.sin(a) * r + (Math.random() - 0.5) * 60);
	  } else {
		x = (Math.random() * GRID) | 0;
		y = (Math.random() * GRID) | 0;
	  }
	  if (x < 0 || y < 0 || x >= GRID || y >= GRID) continue;
	  setCell(x, y, COLORS[(Math.random() * COLORS.length) | 0]);
	}
  })();

  defaultView();

  const fxList = [];

  document.querySelectorAll('.card').forEach((card) => {
	const cv = card.querySelector('.card-grid');
	if (!cv) return;

	const rgb = hexToRgb(card.dataset.color || '#a88bfa');
	const fx = new CardGrid(card, cv, rgb);
	fxList.push(fx);

	const cro = new ResizeObserver(() => fx.resize());
	cro.observe(card);

	card.addEventListener('pointerenter', (e) => {
	  fx.hover = true;
	  const r = card.getBoundingClientRect();
	  fx.mx = e.clientX - r.left;
	  fx.my = e.clientY - r.top;
	});

	card.addEventListener('pointermove', (e) => {
	  const r = card.getBoundingClientRect();
	  fx.mx = e.clientX - r.left;
	  fx.my = e.clientY - r.top;
	  fx.hover = true;
	});

	card.addEventListener('pointerleave', () => {
	  fx.hover = false;
	});

	card.addEventListener('touchstart', (e) => {
	  const t = e.touches[0];
	  if (!t) return;
	  const r = card.getBoundingClientRect();
	  fx.mx = t.clientX - r.left;
	  fx.my = t.clientY - r.top;
	  fx.hover = true;
	  setTimeout(() => { fx.hover = false; }, 700);
	}, { passive: true });
  });

  const FRAME_INTERVAL = 1000 / 40;
  let last = performance.now();
  let lastFrame = 0;

  function loop(now) {
	requestAnimationFrame(loop);

	const sinceFrame = now - lastFrame;
	if (sinceFrame < FRAME_INTERVAL) return;

	lastFrame = now - (sinceFrame % FRAME_INTERVAL);

	let dt = (now - last) / 1000;
	last = now;
	if (dt > 0.06) dt = 0.06;
	if (dt <= 0) return;

	for (let i = 0; i < fxList.length; i++) {
	  fxList[i].update(dt);
	  fxList[i].draw();
	}
  }

  requestAnimationFrame(loop);

  /* ============================================================
	 四、Memo 预览
	 ============================================================ */
  (function initMemoPreview() {
	const box = document.getElementById('memoPreview');
	if (!box) return;

	const KEY = 'flash_notes_public_v2';
	const MAX = 5;

	const esc = (s) => String(s).replace(/[&<>"']/g,
	  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[c]));

	function readNotes() {
	  try {
		const raw = localStorage.getItem(KEY);
		if (!raw) return [];
		const arr = JSON.parse(raw);
		return Array.isArray(arr) ? arr : [];
	  } catch (e) {
		return [];
	  }
	}

	function render() {
	  const notes = readNotes();

	  notes.sort((a, b) => {
		if (a.pinned && !b.pinned) return -1;
		if (!a.pinned && b.pinned) return 1;
		return new Date(b.created_at) - new Date(a.created_at);
	  });

	  const list = notes.slice(0, MAX);

	  if (!list.length) {
		box.innerHTML =
		  '<div class="mp-empty">还没有记录 · <a href="memo.html">去写一条 →</a></div>';
		return;
	  }

	  box.innerHTML = list.map(n => {
		const href = 'memo.html' + (n.id ? '#note-' + encodeURIComponent(n.id) : '');
		return '<a class="mp-item" href="' + href + '">' +
				 '<div class="mp-body">' + esc(n.body) + '</div>' +
			   '</a>';
	  }).join('');

	  idle(() => wrapText(box), 300);
	}

	render();

	window.addEventListener('storage', (e) => {
	  if (e.key === KEY) render();
	});

	document.addEventListener('visibilitychange', () => {
	  if (!document.hidden) render();
	});
  })();

  /* ============================================================
	 五、惰性收尾
	 ============================================================ */
  if (document.fonts && document.fonts.ready) {
	document.fonts.ready.then(() => {
	  idle(() => {
		fxList.forEach(f => f.resize());
		draw();
	  }, 400);
	});
  }

  idle(() => wrapText(document.querySelector('.app')), 500);
})();
</script>
</body>
</html>
